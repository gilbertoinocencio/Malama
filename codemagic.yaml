# ============================================================================
# Codemagic CI/CD — Build iOS do app de usuário Malama (Capacitor + Vite)
# ----------------------------------------------------------------------------
# Pré-requisitos a configurar no painel do Codemagic (uma vez):
#   1. Integração "App Store Connect API key" → nomeie como  malama_asc_key
#      (Issuer ID + Key ID + arquivo .p8 gerados no App Store Connect).
#   2. Grupo de variáveis  malama_vite_env  com as VITE_* (marcar como secret):
#        VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_GEMINI_API_KEY,
#        VITE_APP_URL, VITE_TURN_SERVER_URL, VITE_TURN_USERNAME,
#        VITE_TURN_CREDENTIAL, VITE_COMMUNITY_SYSTEM_USER_ID,
#        VITE_STRAVA_CLIENT_ID, VITE_GOOGLE_FIT_CLIENT_ID  (os que o app usar)
#   3. Variável  APP_APPLE_ID  = o "Apple ID" numérico do app no App Store Connect.
#   4. Bundle ID  com.malama.saude  registrado no Apple Developer com a
#      capability "Sign in with Apple" habilitada.
# ============================================================================

workflows:
  ios-release:
    name: Malama iOS — App Store / TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: malama_asc_key

    environment:
      groups:
        - malama_vite_env
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.malama.saude"
        APPLE_TEAM_ID: "4P83L4L578"
      node: 22
      xcode: latest

    scripts:
      - name: Instalar dependências npm
        script: npm ci

      - name: Build web (Vite → dist)
        script: npm run build

      - name: Sincronizar Capacitor iOS
        script: npx cap sync ios

      - name: Preparar certificado de distribuição + API key
        script: |
          set -e
          keychain initialize
          # Baixa/cria o certificado de distribuição e instala no keychain.
          # --certificate-key usa uma chave privada FIXA (env var CERTIFICATE_PRIVATE_KEY),
          # para que todo build reuse o MESMO certificado em vez de criar um novo a cada
          # vez (a Apple limita a ~2-3 certificados de distribuição).
          # (O profile criado aqui é ignorado — a assinatura automática do xcodebuild
          #  gera o profile correto, com a capability Sign in with Apple.)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          # Grava a API key (.p8) em arquivo para o xcodebuild autenticar no Apple
          # durante o automatic signing (-allowProvisioningUpdates).
          # %b interpreta \n escapadas (o Codemagic pode expor a chave numa linha só).
          mkdir -p "$HOME/private_keys"
          KEYFILE="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          printf '%b' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEYFILE"
          # Valida o PEM antes de prosseguir (falha cedo com diagnóstico claro).
          if ! grep -q 'BEGIN PRIVATE KEY' "$KEYFILE"; then
            echo "ERRO: APP_STORE_CONNECT_PRIVATE_KEY não gerou um .p8 PEM válido."
            echo "Tamanho do arquivo: $(wc -c < "$KEYFILE") bytes (0 = variável vazia)."
            exit 1
          fi
          echo "API key (.p8) escrita e validada ($(wc -c < "$KEYFILE") bytes)."

      - name: Definir número de build (auto-incremento via TestFlight)
        script: |
          set -e
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" 2>/dev/null || echo "0")
          NEXT=$(( ${LATEST:-0} + 1 ))
          cd ios/App
          agvtool new-version -all "$NEXT"

      - name: Resolver dependências SPM (Capacitor usa Swift Package Manager)
        script: |
          set -e
          # Resolve os pacotes Swift antes do build-ipa. Se falhar, o erro REAL
          # do xcodebuild aparece aqui (em vez do genérico "Failed to show build settings").
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -resolvePackageDependencies

      - name: Arquivar e exportar IPA (automatic signing com Sign in with Apple)
        script: |
          set -e
          KEYPATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          # Archive com automatic signing: -allowProvisioningUpdates faz o Xcode
          # criar/atualizar o provisioning profile com TODAS as capabilities do
          # App ID (incl. Sign in with Apple), autenticando via a API key.
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "build/ios/xcarchive/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEYPATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive
          # Exporta a IPA para distribuição na App Store.
          xcodebuild -exportArchive \
            -archivePath "build/ios/xcarchive/App.xcarchive" \
            -exportPath "build/ios/ipa" \
            -exportOptionsPlist "ios/export_options.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEYPATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Sobe automaticamente para o TestFlight a cada build verde.
        submit_to_testflight: true
        # Para submeter à revisão da App Store automaticamente, troque para true
        # depois que os metadados (privacy labels, screenshots, conta demo) estiverem prontos.
        submit_to_app_store: false
