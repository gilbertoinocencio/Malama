# ============================================================================
# Codemagic CI/CD — Build iOS do app de usuário Malama (Capacitor + Vite)
# ----------------------------------------------------------------------------
# Pré-requisitos a configurar no painel do Codemagic (uma vez):
#   1. Integração "App Store Connect API key" → nomeie como  malama_asc_key
#      (Issuer ID + Key ID + arquivo .p8 gerados no App Store Connect).
#   2. Grupo de variáveis  malama_vite_env  com as VITE_* (marcar como secret):
#        VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_GEMINI_API_KEY,
#        VITE_APP_URL, VITE_TURN_SERVER_URL, VITE_TURN_USERNAME,
#        VITE_TURN_CREDENTIAL, VITE_COMMUNITY_SYSTEM_USER_ID,
#        VITE_STRAVA_CLIENT_ID, VITE_GOOGLE_FIT_CLIENT_ID  (os que o app usar)
#   3. Variável  APP_APPLE_ID  = o "Apple ID" numérico do app no App Store Connect.
#   4. Bundle ID  com.malama.saude  registrado no Apple Developer com as
#      capabilities "Sign in with Apple" e "Associated Domains" habilitadas;
#      o profile App Store precisa conter ambas.
# ============================================================================

workflows:
  ios-release:
    name: Malama iOS — App Store / TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: malama_asc_key

    environment:
      groups:
        - malama_vite_env
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.malama.saude"
        APPLE_TEAM_ID: "4P83L4L578"
      node: 22
      xcode: latest

    scripts:
      - name: Instalar dependências npm
        script: npm ci

      - name: Build web (Vite → dist)
        script: npm run build

      - name: Sincronizar Capacitor iOS
        script: npx cap sync ios

      - name: Preparar assinatura (profile com Apple + Associated Domains)
        script: |
          set -e
          keychain initialize
          # Busca o certificado de distribuição (chave fixa CERTIFICATE_PRIVATE_KEY)
          # e o provisioning profile App Store, instalando no keychain.
          # SEM --create de propósito: o profile App Store é criado MANUALMENTE no
          # portal da Apple porque precisa da capability Sign in with Apple — perfis
          # criados pela API NÃO a incluem (causa raiz dos erros de archive anteriores).
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates

          # Descarta profiles que não têm TODAS as capabilities do App.entitlements.
          # Motivo: habilitar uma capability no App ID deixa os profiles antigos
          # inválidos em vez de atualizá-los, e o fetch baixa todos os App Store que
          # existirem — se sobrar um obsoleto, o use-profiles pode escolher justamente
          # ele e o archive quebra lá na frente com um exit 65 sem explicação.
          # Duas pastas: o Xcode moderno usa UserData, o antigo usa MobileDevice.
          # O fetch-signing-files grava na primeira; procurar só na segunda faz o
          # check passar batido e acusar ausência de profile que na verdade existe.
          FOUND_ANY=0
          FOUND_VALID=0
          while IFS= read -r p; do
            FOUND_ANY=1
            security cms -D -i "$p" > /tmp/pp.plist
            NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/pp.plist 2>/dev/null || echo '?')"
            echo "--- profile encontrado: $NAME"
            /usr/libexec/PlistBuddy -c 'Print :Entitlements' /tmp/pp.plist 2>/dev/null \
              | grep -E 'associated-domains|applesignin|healthkit|application-identifier' || true
            if /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.associated-domains' /tmp/pp.plist >/dev/null 2>&1; then
              echo "    OK — tem Associated Domains"
              FOUND_VALID=1
            else
              echo "    DESCARTADO — sem Associated Domains"
              rm -f "$p"
            fi
          done < <(find "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                        "$HOME/Library/MobileDevice/Provisioning Profiles" \
                        -name '*.mobileprovision' 2>/dev/null)

          if [ "$FOUND_ANY" -eq 0 ]; then
            echo "ERRO: o fetch-signing-files nao baixou nenhum profile — verifique a"
            echo "integracao App Store Connect e se existe profile App Store ATIVO para $BUNDLE_ID."
            exit 1
          fi

          if [ "$FOUND_VALID" -eq 0 ]; then
            echo "ERRO: nenhum profile App Store de $BUNDLE_ID tem a capability Associated Domains."
            echo "No portal da Apple (developer.apple.com):"
            echo "  1. Identifiers -> $BUNDLE_ID -> marcar Associated Domains -> Save"
            echo "  2. Profiles -> o profile App Store fica 'Invalid' -> Edit -> Generate"
            echo "     (habilitar a capability NAO atualiza o profile sozinho)"
            echo "  3. Apagar profiles App Store antigos, para sobrar so o novo."
            exit 1
          fi

          # Aplica o profile baixado no projeto (assinatura MANUAL).
          xcode-project use-profiles

      - name: Definir número de build (CFBundleVersion sempre crescente)
        script: |
          set -e
          # Usa o número do build do Codemagic (incrementa a cada build) como
          # CFBundleVersion, garantindo que cada upload seja maior que o anterior.
          # Fallback: timestamp Unix (também sempre crescente).
          NEW_BUILD="$(date +%s)"
          cd ios/App
          agvtool new-version -all "$NEW_BUILD"
          echo "CFBundleVersion definido como $NEW_BUILD"

      - name: Resolver dependências SPM (Capacitor usa Swift Package Manager)
        script: |
          set -e
          # Resolve os pacotes Swift antes do build-ipa. Se falhar, o erro REAL
          # do xcodebuild aparece aqui (em vez do genérico "Failed to show build settings").
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -resolvePackageDependencies

      - name: Gerar IPA assinada (App Store, assinatura manual)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Sobe automaticamente para o TestFlight a cada build verde.
        submit_to_testflight: true
        # Para submeter à revisão da App Store automaticamente, troque para true
        # depois que os metadados (privacy labels, screenshots, conta demo) estiverem prontos.
        submit_to_app_store: false
