<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NURA - Feed the Flow | AI Nutrition & Wellness</title>

    content="Nura aligns your nutrition with your natural rhythm. AI-powered flow state optimization, meal tracking, and personalized wellness plans." />
  <meta name="keywords" content="nutrition, ai, flow state, wellness, meal tracker, health, nura, bio-rhythm" />
  <meta name="theme-color" content="#1A6070" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- PWA & iOS Meta Tags -->
  <link rel="apple-touch-icon" href="/pwa-icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nura.app/" />
  <meta property="og:title" content="NURA - Feed the Flow" />
  <meta property="og:description" content="Align your nutrition with your natural rhythm using AI." />
  <meta property="og:image" content="https://nura.app/og-image.jpg" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://nura.app/" />
  <meta property="twitter:title" content="NURA - Feed the Flow" />
  <meta property="twitter:description" content="Align your nutrition with your natural rhythm using AI." />
  <meta property="twitter:image" content="https://nura.app/og-image.jpg" />

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@200..800&family=Spline+Sans:wght@300;400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Epilogue:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@200..800&family=Inter:wght@300;400;500;600;700&family=Lexend:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1"
    rel="stylesheet" />

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .glass-panel {
      background: rgba(26, 44, 46, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .text-glow {
      text-shadow: 0 0 10px rgba(59, 7, 100, 0.5);
    }

    .dark .text-glow {
      text-shadow: 0 0 10px rgba(126, 34, 206, 0.5);
    }

    /* Timeline CSS */
    .timeline-item {
      position: relative;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: 23px;
      top: 48px;
      bottom: -16px;
      width: 2px;
      background-color: #e2e8f0;
      z-index: 0;
    }

    .dark .timeline-item::before {
      background-color: #2a3b42;
    }

    .timeline-item:last-child::before {
      display: none;
    }

    /* Profile Radio Inputs */
    input[type="radio"]:checked+div {
      border-color: #8C6A4B;
      background-color: rgba(140, 106, 75, 0.05);
    }

    input[type="radio"]:checked+div .radio-indicator {
      background-color: #8C6A4B;
      border-color: #8C6A4B;
    }

    input[type="radio"]:checked+div .text-label {
      color: #8C6A4B;
    }

    /* Profile Range Slider */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: #8C6A4B;
      cursor: pointer;
      margin-top: -10px;
      box-shadow: 0 0 0 4px rgba(28, 25, 23, 1);
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: #292524;
      border-radius: 2px;
    }

    /* Refine Range Slider Custom Styles */
    .range-refine::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #154c59;
      cursor: pointer;
      margin-top: -10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .range-refine::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: #e5e7eb;
      border-radius: 9999px;
    }

    .dark .range-refine::-webkit-slider-runnable-track {
      background: #374151;
    }

    .dark .range-refine::-webkit-slider-thumb {
      background: #242a2d;
      border-color: #154c59;
    }

    /* Home Circular Chart */
    .circular-chart {
      display: block;
      margin: 0 auto;
      max-width: 80%;
      max-height: 250px;
    }

    .circle-bg {
      fill: none;
      stroke: #18282e;
      stroke-width: 2.5;
    }

    .light-circle-bg {
      stroke: #e7e5e4;
    }

    .circle {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 62, 100;
      stroke: #3b0764;
      filter: drop-shadow(0 0 6px rgba(59, 7, 100, 0.4));
      transition: all 0.3s ease;
    }

    .dark .circle {
      stroke: #7e22ce;
      filter: drop-shadow(0 0 6px rgba(126, 34, 206, 0.4));
    }

    /* Flow Adaptation Ring */
    .ring-gradient {
      background: conic-gradient(from 0deg, #11a4d4 0%, #11a4d4 35%, #264653 35%, #264653 100%);
    }

    /* Analysis Chart Animations */
    .chart-path {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawLine 2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: 0.3s;
    }

    @keyframes drawLine {
      to {
        stroke-dashoffset: 0;
      }
    }
  </style>

  <link rel="stylesheet" href="/src/index.css">
</head>

<body
  class="bg-nura-bg dark:bg-background-dark text-nura-main dark:text-white transition-colors duration-300 font-jakarta antialiased overflow-x-hidden selection:bg-primary/30">
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
