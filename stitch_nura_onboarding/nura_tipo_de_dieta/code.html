</button>
<span class="font-['LexEND'] uppercase tracking-widest text-sm text-[#005F6B] dark:text-[#008ba0]">NURA</span>

</header>
<main class="max-w-md mx-auto pt-24 pb-32 px-6 flex flex-col min-h-screen">
<!-- Content Header -->
<div class="mb-10 space-y-2">
<p class="text-tertiary font-headline font-semibold text-xs tracking-widest uppercase">Passo 12 de 37</p>
<h1 class="text-primary font-headline text-3xl font-bold leading-tight tracking-tight">Que tipo de dieta prefere?</h1>
<p class="text-on-surface-variant text-sm font-medium">Personalize o seu percurso de nutrição consciente.</p>
</div>
<!-- Asymmetric Options List -->
<div class="space-y-4">
<!-- Option Card: Equilibrada (Selected State Example) -->
<button class="w-full text-left bg-primary-fixed-dim rounded-lg p-6 flex justify-between items-center transition-all duration-300 shadow-sm">
<div class="space-y-1">
<span class="text-primary font-headline font-semibold text-lg">Equilibrada</span>
<p class="text-on-primary-fixed-variant text-xs opacity-80">Uma abordagem completa e variada.</p>
</div>
<div class="w-6 h-6 rounded-full bg-secondary flex items-center justify-center">
<span class="material-symbols-outlined text-white text-sm" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Option Card: Vegetariana -->
<button class="w-full text-left bg-surface-container-low hover:bg-surface-container-high rounded-lg p-6 flex justify-between items-center transition-all duration-300">
<div class="space-y-1">
<span class="text-on-surface font-headline font-semibold text-lg">Vegetariana</span>
<p class="text-on-surface-variant text-xs">Focada em plantas, inclui ovos e laticínios.</p>
</div>
<span class="material-symbols-outlined text-outline-variant opacity-20">eco</span>
</button>
<!-- Option Card: Vegan -->
<button class="w-full text-left bg-surface-container-low hover:bg-surface-container-high rounded-lg p-6 flex justify-between items-center transition-all duration-300">
<div class="space-y-1">
<span class="text-on-surface font-headline font-semibold text-lg">Vegan</span>
<p class="text-on-surface-variant text-xs">Exclusivamente à base de plantas.</p>
</div>
<span class="material-symbols-outlined text-outline-variant opacity-20">cannabis</span>
</button>
<!-- Option Card: Paleo -->
<button class="w-full text-left bg-surface-container-low hover:bg-surface-container-high rounded-lg p-6 flex justify-between items-center transition-all duration-300">
<div class="space-y-1">
<span class="text-on-surface font-headline font-semibold text-lg">Paleo</span>
<p class="text-on-surface-variant text-xs">Focada em alimentos naturais e ancestrais.</p>
</div>
<span class="material-symbols-outlined text-outline-variant opacity-20">outdoor_grill</span>
</button>
<!-- Option Card: Cetogénica -->
<button class="w-full text-left bg-surface-container-low hover:bg-surface-container-high rounded-lg p-6 flex justify-between items-center transition-all duration-300">
<div class="space-y-1">
<span class="text-on-surface font-headline font-semibold text-lg">Cetogénica</span>
<p class="text-on-surface-variant text-xs">Baixo carbo e alta gordura saudável.</p>
</div>
<span class="material-symbols-outlined text-outline-variant opacity-20">bolt</span>
</button>
<!-- Option Card: Rica em proteína -->
<button class="w-full text-left bg-surface-container-low hover:bg-surface-container-high rounded-lg p-6 flex justify-between items-center transition-all duration-300">
<div class="space-y-1">
<span class="text-on-surface font-headline font-semibold text-lg">Rica em proteína</span>

</div>
<span class="material-symbols-outlined text-outline-variant opacity-20">fitness_center</span>
</button>

</div>
<span class="material-symbols-outlined text-outline-variant opacity-20">nutrition</span>
</button>
</div>
