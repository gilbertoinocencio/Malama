<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-surface-variant": "#3f484a",
              "primary-fixed-dim": "#8bd2df",
              "on-secondary-fixed": "#00210c",
              "surface-container-low": "#f3f4f0",
              "on-tertiary-fixed": "#301400",
              "secondary": "#006d36",
              "surface": "#f9faf6",
              "on-surface": "#1a1c1a",
              "on-secondary": "#ffffff",
              "primary": "#00464f",
              "surface-variant": "#e2e3df",
              "on-error": "#ffffff",
              "surface-container-highest": "#e2e3df",
              "secondary-container": "#83fba5",
              "on-tertiary-container": "#ffbd8f",
              "inverse-on-surface": "#f0f1ed",
              "surface-tint": "#156874",
              "surface-dim": "#d9dad7",
              "on-tertiary": "#ffffff",
              "primary-container": "#005f6b",
              "outline-variant": "#bec8ca",
              "tertiary-fixed-dim": "#ffb783",
              "surface-container-high": "#e7e9e5",
              "secondary-fixed": "#83fba5",
              "on-tertiary-fixed-variant": "#6b3a11",
              "outline": "#6f797b",
              "on-primary-fixed": "#001f24",
              "tertiary-fixed": "#ffdcc5",
              "inverse-surface": "#2e312f",
              "on-secondary-container": "#00743a",
              "error": "#ba1a1a",
              "on-primary-container": "#90d6e4",
              "on-error-container": "#93000a",
              "tertiary-container": "#7d491f",
              "surface-container": "#edeeea",
              "surface-bright": "#f9faf6",
              "on-primary": "#ffffff",
              "background": "#f9faf6",
              "surface-container-lowest": "#ffffff",
              "on-primary-fixed-variant": "#004e59",
              "tertiary": "#613309",
              "secondary-fixed-dim": "#66dd8b",
              "on-secondary-fixed-variant": "#005227",
              "inverse-primary": "#8bd2df",
              "primary-fixed": "#a7eefc",
              "on-background": "#1a1c1a",
              "error-container": "#ffdad6"
            },
            fontFamily: {
              "headline": ["Lexend"],
              "body": ["Plus Jakarta Sans"],
              "label": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Intentional Asymmetry Decorative Element */
      .contextual-leaf {
        position: fixed;
        top: 15%;
        right: -5%;
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, #83fba5 0%, transparent 70%);
        opacity: 0.15;
        filter: blur(60px);
        z-index: -1;
        pointer-events: none;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col overflow-x-hidden">
<!-- Progress Bar (The Sutil Flow) -->
<div class="fixed top-0 left-0 w-full h-1 bg-surface-container-high z-[60]">
<div class="h-full bg-secondary w-4/6 transition-all duration-700 ease-in-out"></div>
</div>
<!-- Decorative Canvas -->
<div class="contextual-leaf"></div>
<!-- Top Navigation (Shared Component Shell) -->
<header class="bg-[#f5fcdf] dark:bg-stone-900 w-full top-0 px-6 py-4 z-50">
<div class="flex items-center justify-between w-full max-w-screen-xl mx-auto">
<button class="text-[#00464f] dark:text-teal-400 active:scale-95 transition-transform hover:bg-[#00464f]/5 p-2 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-['Lexend'] font-black text-2xl tracking-widest text-[#00464f] dark:text-teal-400">NURA</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</div>
</header>
<!-- Main Content (The Digital Sanctuary) -->
<main class="flex-grow flex flex-col items-center justify-center px-6 py-12 max-w-2xl mx-auto w-full">
<!-- Header Section (Editorial Impact) -->
<section class="w-full mb-16 space-y-4">
<h2 class="font-headline text-4xl md:text-5xl font-bold text-primary tracking-tight leading-tight">
                Qual a velocidade do seu objetivo?
            </h2>
<p class="text-on-surface-variant text-lg max-w-md font-body leading-relaxed">
                Cada ritmo é único. Escolha a intensidade que melhor se adapta à sua rotina e bem-estar.
            </p>
</section>
<!-- Selector Grid (Intentional Asymmetry & Tonal Layering) -->
<div class="grid grid-cols-1 gap-6 w-full">
<!-- Sustainable Option -->
<button class="group relative w-full text-left p-8 rounded-lg bg-surface-container-lowest transition-all duration-300 hover:bg-surface-container hover:shadow-sm flex items-center gap-6 overflow-hidden">
<div class="flex-shrink-0 w-16 h-16 flex items-center justify-center rounded-full bg-secondary-container/20 text-secondary">
<span class="material-symbols-outlined !text-4xl" data-icon="potted_plant">potted_plant</span>
</div>
<div class="flex-grow">
<h3 class="font-headline text-xl font-bold text-primary">Lento e sustentável</h3>
<p class="text-on-surface-variant font-body mt-1">Mudanças graduais que respeitam o seu tempo.</p>
</div>
<div class="opacity-0 group-focus:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Fast Option (Selected Style Highlight) -->
<button class="relative w-full text-left p-8 rounded-lg bg-primary-fixed-dim transition-all duration-300 flex items-center gap-6 overflow-hidden shadow-sm">
<div class="flex-shrink-0 w-16 h-16 flex items-center justify-center rounded-full bg-primary text-on-primary">
<span class="material-symbols-outlined !text-4xl" data-icon="bolt">bolt</span>
</div>
<div class="flex-grow">
<h3 class="font-headline text-xl font-bold text-primary">Rápido</h3>
<p class="text-on-primary-fixed-variant font-body mt-1">Intensidade máxima para resultados imediatos.</p>
</div>
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-secondary text-white">
<span class="material-symbols-outlined !text-xl" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
</div>
<!-- Numerical Insight (Subtle Contextual Leaf Element Influence) -->
<div class="mt-16 w-full p-8 border-l-4 border-tertiary-fixed-dim bg-surface-container-low rounded-r-lg">
<p class="font-body text-on-tertiary-fixed-variant italic">
                "O equilíbrio entre esforço e paciência é o segredo de uma jornada duradoura."
            </p>
</div>
</main>
<!-- Bottom Navigation Shell (The Anchor) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex flex-col items-center justify-center px-6 pb-10 pt-4 bg-transparent">
<div class="max-w-md w-full">
<button class="flex items-center justify-center bg-gradient-to-r from-[#00464f] to-[#005f6b] text-white rounded-full h-16 w-full shadow-lg hover:brightness-110 active:scale-[0.98] transition-all duration-300 group">
<span class="font-['Lexend'] font-semibold text-base mr-2">Continuar</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</nav>
<!-- Floating Graphic Detail (The Soul) -->
<div class="fixed bottom-24 left-10 opacity-5 pointer-events-none select-none">
<span class="material-symbols-outlined !text-9xl" data-icon="spa">spa</span>
</div>
</body></html>
