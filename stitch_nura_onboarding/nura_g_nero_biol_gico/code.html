<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NURA Onboarding - Gênero Biológico</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-fixed-variant": "#6b3a11",
              "on-error-container": "#93000a",
              "secondary": "#006d36",
              "on-secondary-fixed-variant": "#005227",
              "surface-container": "#edeeea",
              "inverse-on-surface": "#f0f1ed",
              "error-container": "#ffdad6",
              "surface-bright": "#f9faf6",
              "surface-variant": "#e2e3df",
              "surface": "#f9faf6",
              "on-primary": "#ffffff",
              "surface-container-low": "#f3f4f0",
              "outline": "#6f797b",
              "error": "#ba1a1a",
              "on-tertiary-container": "#ffbd8f",
              "surface-dim": "#d9dad7",
              "surface-container-highest": "#e2e3df",
              "tertiary": "#613309",
              "primary-fixed": "#a7eefc",
              "on-primary-container": "#90d6e4",
              "background": "#f9faf6",
              "tertiary-fixed-dim": "#ffb783",
              "on-background": "#1a1c1a",
              "secondary-fixed": "#83fba5",
              "primary-fixed-dim": "#8bd2df",
              "tertiary-container": "#7d491f",
              "on-secondary-fixed": "#00210c",
              "tertiary-fixed": "#ffdcc5",
              "outline-variant": "#bec8ca",
              "on-primary-fixed-variant": "#004e59",
              "primary-container": "#005f6b",
              "on-primary-fixed": "#001f24",
              "on-surface-variant": "#3f484a",
              "on-secondary": "#ffffff",
              "secondary-container": "#83fba5",
              "on-secondary-container": "#00743a",
              "on-error": "#ffffff",
              "on-tertiary-fixed": "#301400",
              "surface-container-lowest": "#ffffff",
              "on-tertiary": "#ffffff",
              "surface-container-high": "#e7e9e5",
              "inverse-surface": "#2e312f",
              "surface-tint": "#156874",
              "secondary-fixed-dim": "#66dd8b",
              "on-surface": "#1a1c1a",
              "inverse-primary": "#8bd2df",
              "primary": "#00464f"
            },
            fontFamily: {
              "headline": ["Lexend"],
              "body": ["Plus Jakarta Sans"],
              "label": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "1.5rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      }
      .active-selector {
        background-color: #8bd2df !important; /* primary-fixed-dim */
        border: none !important;
      }
      .glass-effect {
        backdrop-filter: blur(20px);
        background: rgba(255, 255, 255, 0.7);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col">
<!-- Progress Bar (The Sutil Flow) -->
<div class="fixed top-0 left-0 w-full h-1 bg-surface-container-high z-[60]">
<div class="h-full bg-secondary w-[48.6%]" style="transition: width 1s ease-in-out;"></div>
</div>
<!-- Top Navigation Anchor (Shared Component) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-6 h-16 bg-[#f5fcdf] dark:bg-slate-900 transition-all duration-300">
<button class="p-2 hover:bg-[#005F6B]/5 transition-all duration-300 rounded-full text-[#005F6B] flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-lexend font-bold text-[#005F6B] tracking-widest text-2xl">NURA</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Contextual Leaf (Decorative background) -->
<div class="fixed top-1/4 -right-20 w-64 h-64 bg-secondary-container opacity-20 blur-3xl rounded-full pointer-events-none"></div>
<div class="fixed bottom-1/4 -left-20 w-80 h-80 bg-primary-container opacity-10 blur-3xl rounded-full pointer-events-none"></div>
<main class="flex-grow flex flex-col items-center justify-center px-6 pt-24 pb-32 max-w-2xl mx-auto w-full relative z-10">
<!-- Header Section (Editorial Clarity) -->
<div class="w-full mb-12 space-y-4">
<span class="text-on-surface-variant font-label text-sm uppercase tracking-widest font-medium">Passo 18 de 37</span>
<h1 class="font-headline text-4xl md:text-5xl font-bold text-primary tracking-tight leading-tight">Gênero Biológico</h1>
<p class="font-body text-lg text-on-surface-variant max-w-md">Personalize a ciência por trás do seu plano.</p>
</div>
<!-- Elegance Selector Cards (Selective Option Cards) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
<!-- Option: Masculino -->
<button class="group flex flex-col items-center justify-center p-12 bg-surface-container-low rounded-lg transition-all duration-300 hover:bg-surface-container-highest active:scale-95 text-left relative overflow-hidden">
<div class="mb-6">
<span class="material-symbols-outlined text-6xl text-primary transition-transform group-hover:scale-110 duration-500" data-icon="male">male</span>
</div>
<span class="font-headline text-xl font-semibold text-primary">Masculino</span>
<!-- Subtle selection indicator hidden by default -->
<div class="absolute top-4 right-4 opacity-0 transition-opacity duration-300">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Option: Feminino (Selected Example State) -->
<button class="group flex flex-col items-center justify-center p-12 bg-primary-fixed-dim rounded-lg transition-all duration-300 active:scale-95 text-left relative overflow-hidden">
<div class="mb-6">
<span class="material-symbols-outlined text-6xl text-primary transition-transform group-hover:scale-110 duration-500" data-icon="female">female</span>
</div>
<span class="font-headline text-xl font-semibold text-primary">Feminino</span>
<!-- Selection indicator -->
<div class="absolute top-6 right-6 opacity-100">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
</div>
<!-- Footer Action (Premium Layout) -->
<div class="fixed bottom-0 left-0 w-full p-8 md:p-12 flex justify-center items-center pointer-events-none">
<div class="w-full max-w-2xl flex justify-between items-center pointer-events-auto">
<button class="text-primary font-semibold py-4 px-8 rounded-full hover:bg-surface-container-low transition-all duration-300">
                    Anterior
                </button>
<button class="bg-primary hover:bg-primary-container text-on-primary font-headline font-bold py-5 px-14 rounded-lg shadow-lg shadow-primary/10 transition-all duration-300 active:scale-95 flex items-center gap-3">
                    Continuar
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</main>
<!-- Contextual Shell Suppression: BottomNavBar is hidden for this transactional onboarding screen per requirements -->
</body></html>
