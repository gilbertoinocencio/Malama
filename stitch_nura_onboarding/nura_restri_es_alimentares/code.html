<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NURA - Restrições Alimentares</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>

                "secondary-container": "#83fba5",
                "on-error": "#ffffff",
                "inverse-surface": "#2e312f",
                "inverse-primary": "#8bd2df",

                "error": "#ba1a1a",
                "on-secondary-fixed-variant": "#005227",
                "tertiary-container": "#7d491f",
                "surface": "#f9faf6",
                "on-surface": "#1a1c1a",

                "surface-container-high": "#e7e9e5",

                "tertiary-fixed-dim": "#ffb783",
                "on-primary-fixed": "#001f24",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .active-ring {
            box-shadow: 0 0 0 2px #006d36;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface selection:bg-primary-fixed selection:text-primary min-h-screen flex flex-col">
<!-- Progress Bar (The Sutil Flow) -->
<div class="fixed top-0 left-0 w-full h-1 bg-surface-container-high z-[60]">
<div class="h-full bg-secondary w-3/4 transition-all duration-1000 ease-out"></div>
</div>
<!-- TopAppBar (Shared Component Logic) -->
<nav class="fixed top-0 w-full z-50 bg-stone-50/70 dark:bg-stone-950/70 backdrop-blur-xl flex items-center justify-between px-8 h-20 w-full no-border tonal-shift bg-stone-100/50 dark:bg-stone-900/50">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-teal-900 dark:text-teal-500 hover:bg-stone-200/50 dark:hover:bg-stone-800/50 transition-all duration-300 ease-in-out p-2 rounded-full scale-95 duration-300">
                close
            </button>
</div>
<span class="font-lexend tracking-tight font-medium text-2xl font-bold tracking-tighter text-teal-900 dark:text-teal-500">NURA</span>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</nav>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-6 pt-24 pb-32 max-w-2xl mx-auto w-full">
<!-- Contextual Leaf Decoration -->
<div class="fixed top-40 -left-20 opacity-20 pointer-events-none transform -rotate-12">
<span class="material-symbols-outlined text-[20rem] text-secondary-container">eco</span>
</div>
<header class="w-full mb-12 space-y-4">
<h1 class="font-headline text-4xl md:text-5xl text-primary font-bold leading-tight tracking-tight">
                Tem alguma restrição alimentar?
            </h1>
<p class="text-on-surface-variant text-lg max-w-md">
                Isso nos ajuda a personalizar suas recomendações e receitas para o seu bem-estar.
            </p>
</header>
<!-- Selection Cards (The "Elegance" Selector) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
<!-- Option: Sem lactose -->
<button class="group flex flex-col items-start p-8 bg-surface-container-low rounded-xl text-left transition-all duration-500 hover:bg-surface-container-high focus:outline-none focus:ring-2 focus:ring-secondary/20">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center mb-6 group-focus:bg-secondary-container transition-colors duration-500">
<span class="material-symbols-outlined text-tertiary text-2xl">water_drop</span>
</div>
<span class="text-xl font-headline font-medium text-primary mb-2">Sem lactose</span>
<span class="text-sm text-on-surface-variant leading-relaxed">Evita derivados de leite e produtos contendo lactose.</span>
</button>
<!-- Option: Sem glúten (Selected State Example) -->
<button class="group flex flex-col items-start p-8 bg-primary-fixed-dim rounded-xl text-left transition-all duration-500 ring-2 ring-secondary/40 relative">
<div class="absolute top-6 right-6 w-8 h-8 rounded-full bg-secondary flex items-center justify-center text-white">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-tertiary text-2xl">bakery_dining</span>
</div>
<span class="text-xl font-headline font-medium text-primary mb-2">Sem glúten</span>
<span class="text-sm text-on-surface-variant leading-relaxed">Ideal para celíacos ou sensibilidade ao trigo e cevada.</span>
</button>
<!-- Option: Sem açúcar -->
<button class="group flex flex-col items-start p-8 bg-surface-container-low rounded-xl text-left transition-all duration-500 hover:bg-surface-container-high focus:outline-none focus:ring-2 focus:ring-secondary/20">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center mb-6 group-focus:bg-secondary-container transition-colors duration-500">
<span class="material-symbols-outlined text-tertiary text-2xl">destruction</span>
</div>
<span class="text-xl font-headline font-medium text-primary mb-2">Sem açúcar</span>
<span class="text-sm text-on-surface-variant leading-relaxed">Foco em alimentos naturais sem adição de sacarose.</span>
</button>
<!-- Option: Alergias -->
<button class="group flex flex-col items-start p-8 bg-surface-container-low rounded-xl text-left transition-all duration-500 hover:bg-surface-container-high focus:outline-none focus:ring-2 focus:ring-secondary/20">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center mb-6 group-focus:bg-secondary-container transition-colors duration-500">
<span class="material-symbols-outlined text-tertiary text-2xl">warning</span>
</div>
<span class="text-xl font-headline font-medium text-primary mb-2">Alergias</span>
<span class="text-sm text-on-surface-variant leading-relaxed">Amendoim, frutos do mar, ovos ou outros específicos.</span>
</button>
</div>
<!-- Footer Action -->
<div class="w-full mt-16 flex flex-col items-center gap-6">
<button class="w-full md:w-80 h-16 bg-gradient-to-r from-primary to-primary-container text-on-primary font-lexend font-medium text-lg rounded-xl shadow-lg shadow-primary/10 hover:shadow-xl hover:shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all duration-300">
                Continuar
            </button>
<button class="text-on-surface-variant font-medium hover:text-primary transition-colors py-2 px-6 rounded-full hover:bg-surface-container-high transition-all">
                Pular esta etapa
            </button>
</div>
</main>
<!-- Contextual Leaf Decoration Bottom -->
<div class="fixed bottom-10 -right-20 opacity-10 pointer-events-none transform rotate-45">
<span class="material-symbols-outlined text-[25rem] text-tertiary-fixed">spa</span>
</div>
<!-- No BottomNavBar for Transactional/Onboarding Step as per rules -->
</body></html>
