<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NURA - Reminder Schedule</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {

                    colors: {

                        "on-secondary": "#ffffff",
                        "surface-container": "#edeeea",
                        "outline": "#6f797b",
                        "secondary-container": "#83fba5",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2e312f",
                        "inverse-primary": "#8bd2df",
                        "on-surface-variant": "#3f484a",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#005227",
                        "tertiary-container": "#7d491f",
                        "surface": "#f9faf6",
                        "on-surface": "#1a1c1a",
                        "primary": "#00464f",
                        "primary-fixed-dim": "#8bd2df",
                        "surface-tint": "#156874",
                        "tertiary-fixed": "#ffdcc5",

                        "tertiary-fixed-dim": "#ffb783",
                        "on-primary-fixed": "#001f24",
                        "secondary": "#006d36",

                    fontFamily: {

                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },

<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-lexend { font-family: 'Lexend', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Progress Bar (Sutil Flow) -->
<div class="fixed top-0 left-0 w-full h-1 bg-surface-container-high z-[60]">
<div class="h-full bg-secondary w-2/3 transition-all duration-1000"></div>
</div>
<!-- TopAppBar -->
<header class="bg-stone-50/70 dark:bg-stone-950/70 backdrop-blur-xl fixed top-0 w-full z-50 flex items-center justify-between px-8 h-20 w-full no-border tonal-shift bg-stone-100/50 dark:bg-stone-900/50 flat no shadows">
<button class="text-teal-900 dark:text-teal-500 hover:bg-stone-200/50 dark:hover:bg-stone-800/50 transition-all duration-300 ease-in-out p-2 rounded-full scale-95 duration-300">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<span class="text-2xl font-bold tracking-tighter text-teal-900 dark:text-teal-500 font-lexend tracking-tight font-medium">NURA</span>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow flex flex-col items-center justify-center px-6 pt-24 pb-32">
<div class="w-full max-w-xl space-y-12">
<!-- Contextual Leaf Decoration -->
<div class="fixed top-1/4 -right-20 opacity-20 pointer-events-none">
<span class="material-symbols-outlined text-[20rem] text-secondary-container" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<!-- Header Section -->
<div class="space-y-4">
<h2 class="font-headline text-on-surface-variant text-sm font-medium tracking-[0.2em] uppercase">Mantenha o seu Flow</h2>
<h1 class="font-headline text-4xl md:text-5xl lg:text-6xl text-primary font-bold tracking-tight leading-tight">
                    Quando quer ser lembrado das suas refeições?
                </h1>
</div>
<!-- Time Selector Bento Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 relative z-10">
<!-- Start Window Card -->
<div class="bg-surface-container-low p-8 rounded-lg group hover:bg-surface-container-lowest transition-all duration-500 cursor-pointer">
<p class="font-headline text-primary-container font-semibold mb-6">Início da Janela</p>
<div class="flex items-end gap-2">
<span class="font-headline text-6xl md:text-7xl text-primary tracking-tighter">08</span>
<span class="font-headline text-4xl text-outline-variant mb-2">:</span>
<span class="font-headline text-6xl md:text-7xl text-primary tracking-tighter">30</span>
</div>
<div class="mt-8 h-0.5 w-full bg-surface-container-highest group-hover:bg-primary transition-all duration-500"></div>
<p class="mt-4 text-on-surface-variant text-sm font-light">Primeiro alerta do dia</p>
</div>
<!-- End Window Card -->
<div class="bg-surface-container-low p-8 rounded-lg group hover:bg-surface-container-lowest transition-all duration-500 cursor-pointer border-2 border-transparent hover:border-primary-fixed-dim">
<div class="flex justify-between items-start">
<p class="font-headline text-primary-container font-semibold mb-6">Fim da Janela</p>
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="flex items-end gap-2">
<span class="font-headline text-6xl md:text-7xl text-primary tracking-tighter">20</span>
<span class="font-headline text-4xl text-outline-variant mb-2">:</span>
<span class="font-headline text-6xl md:text-7xl text-primary tracking-tighter">00</span>
</div>
<div class="mt-8 h-0.5 w-full bg-primary transition-all duration-500"></div>
<p class="mt-4 text-on-surface-variant text-sm font-light">Último alerta do dia</p>
</div>
</div>
<!-- Instructional Text -->
<div class="flex items-start gap-4 p-6 bg-surface-container/50 rounded-xl">
<span class="material-symbols-outlined text-primary mt-1" data-icon="info">info</span>
<p class="text-on-surface-variant text-sm leading-relaxed">
                    Sugerimos uma janela de 12 horas para manter o equilíbrio metabólico e a clareza mental durante o dia.
                </p>
</div>
<!-- Primary Action -->
<div class="pt-8 flex justify-end">
<button class="bg-primary text-on-primary font-headline font-semibold text-lg px-12 py-5 rounded-xl flex items-center gap-4 transition-all duration-500 hover:scale-[1.02] active:scale-95 shadow-xl shadow-primary/10">
                    Salvar e Continuar
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar (Suppressed on focused onboarding tasks as per rule, but structural placeholder if needed) -->
<!-- Not rendered per: "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional: Login, Sign-up, Onboarding..." -->
<!-- Decorative Bottom Elements -->
<div class="fixed bottom-0 left-0 w-full h-32 bg-gradient-to-t from-surface to-transparent pointer-events-none z-0"></div>
</body></html>
