<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Sutil Flow Progress Bar -->
<div class="fixed top-0 left-0 w-full h-1 bg-surface-container-high z-[60]">
<div class="h-full bg-secondary w-1/3 transition-all duration-700 ease-in-out"></div>
</div>
<!-- TopAppBar - Suppressed during onboarding but following Brand Anchor for consistency -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-6 h-20 bg-[#f5fcdf] dark:bg-slate-950">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary cursor-pointer">arrow_back</span>
</div>
<h1 class="text-[#00464f] dark:text-[#005F6B] font-['Lexend'] font-black tracking-widest text-2xl uppercase">NURA</h1>
<div class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden">
<img alt="User profile" class="w-full h-full object-cover" data-alt="User profile placeholder avatar" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCM1TPym6ciQ_M8zmd-9cr4M6g6snt4i2Hrm9eqGgZ0MBwOUPECPhvudBdPzzC8RiK6g-8K0rQCexC_BZu4yr3K_Ol4pO1Rb3oZ_x49q3O4--PYhrIwh0zVGxbrjJFg1fHAXqU9OFOXmhahocCtJbhp1bPwKA8tpqGl4tTyxs8xba3EXAZWbLfQ-R_NhYktbmJK3nBwvSXn5sTell-3ghQEzU1mQd1Q5Ned4JP_XRyFc4KocQK5XhG4Rm0OPzwhKVp0-tLs1J41P70"/>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-6 pt-28 pb-32 max-w-lg mx-auto w-full relative overflow-hidden">
<!-- Decorative "Contextual Leaf" -->
<div class="absolute -top-10 -right-10 w-64 h-64 bg-secondary-container/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-1/2 -left-20 w-48 h-48 bg-tertiary-fixed/10 rounded-full blur-2xl pointer-events-none"></div>
<!-- Section 1: Objectives -->
<div class="space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-1000">
<header class="space-y-4">
<span class="text-tertiary font-headline font-semibold text-sm tracking-widest uppercase">Passo 1 de 3</span>
<h2 class="text-primary font-headline font-bold text-4xl leading-tight">Qual é o seu objetivo principal?</h2>
<p class="text-on-surface-variant text-lg">Personalize sua jornada para o seu bem-estar.</p>
</header>
<!-- Selective Option Cards (The Elegance Selector) -->
<div class="grid grid-cols-1 gap-6">
<!-- Selected State Example -->
<button class="flex items-center justify-between w-full p-8 rounded-lg bg-primary-fixed-dim text-left transition-all duration-300 transform hover:scale-[1.02] active:scale-95 group">
<div class="space-y-1">
<span class="text-primary font-headline font-semibold text-xl block">Perder peso</span>
<span class="text-on-primary-fixed-variant/70 text-sm">Foco em déficit calórico e nutrição consciente.</span>
</div>
<span class="material-symbols-outlined text-secondary text-3xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="flex items-center justify-between w-full p-8 rounded-lg bg-surface-container-low text-left transition-all duration-300 transform hover:scale-[1.02] active:scale-95 group">
<div class="space-y-1">
<span class="text-on-surface font-headline font-semibold text-xl block">Manter o peso</span>
<span class="text-on-surface-variant text-sm">Equilíbrio e longevidade alimentar.</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">circle</span>
</button>
<button class="flex items-center justify-between w-full p-8 rounded-lg bg-surface-container-low text-left transition-all duration-300 transform hover:scale-[1.02] active:scale-95 group">
<div class="space-y-1">
<span class="text-on-surface font-headline font-semibold text-xl block">Ganhar peso</span>
<span class="text-on-surface-variant text-sm">Ganho de massa muscular e vitalidade.</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">circle</span>
</button>
</div>
</div>
<!-- Additional Goals (Multi-select) Hidden in this view but part of the flow -->
<!-- For the sake of the prompt "Screen 3: Additional Goals", demonstrating the multi-select bento style below -->
<div class="mt-20 space-y-8">
<header class="space-y-2">
<h3 class="text-primary font-headline font-bold text-2xl">Algum objetivo adicional?</h3>
<p class="text-on-surface-variant">Selecione todos que se aplicam a você.</p>
</header>
<div class="grid grid-cols-2 gap-4">
<button class="flex flex-col gap-3 p-6 rounded-lg bg-surface-container-low transition-all duration-300 border-2 border-transparent hover:border-secondary-container active:scale-95">
<span class="material-symbols-outlined text-primary text-2xl">favorite</span>
<span class="text-on-surface font-headline font-medium text-sm">Relação saudável</span>
</button>
<button class="flex flex-col gap-3 p-6 rounded-lg bg-primary-fixed-dim/30 border-2 border-secondary transition-all duration-300 active:scale-95">
<span class="material-symbols-outlined text-secondary text-2xl" style="font-variation-settings: 'FILL' 1;">spa</span>
<span class="text-on-surface font-headline font-medium text-sm">Bem-estar</span>
</button>
<button class="flex flex-col gap-3 p-6 rounded-lg bg-surface-container-low transition-all duration-300 hover:border-secondary-container active:scale-95">
<span class="material-symbols-outlined text-primary text-2xl">psychology</span>
<span class="text-on-surface font-headline font-medium text-sm">Stress</span>
</button>
<button class="flex flex-col gap-3 p-6 rounded-lg bg-surface-container-low transition-all duration-300 hover:border-secondary-container active:scale-95">
<span class="material-symbols-outlined text-primary text-2xl">bedtime</span>
<span class="text-on-surface font-headline font-medium text-sm">Sono</span>
</button>
<button class="col-span-2 flex items-center justify-between p-6 rounded-lg bg-surface-container-low transition-all duration-300 hover:border-secondary-container active:scale-95">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-2xl">bolt</span>
<span class="text-on-surface font-headline font-medium text-sm">Energia</span>
</div>
<span class="material-symbols-outlined text-outline-variant">add_circle</span>
</button>
</div>
</div>
</main>
<!-- Fixed Action Bottom Bar (Onboarding Version) -->
<div class="fixed bottom-0 left-0 w-full p-6 glass-effect z-50">
<div class="max-w-lg mx-auto">
<button class="w-full h-16 bg-primary text-on-primary font-headline font-bold text-lg rounded-lg shadow-lg hover:opacity-90 transition-all duration-300 flex items-center justify-center gap-2">
                Continuar
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
