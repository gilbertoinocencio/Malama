<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-fixed-variant": "#005227",
                        "primary": "#00464f",
                        "on-secondary": "#ffffff",
                        "surface": "#f9faf6",
                        "error-container": "#ffdad6",
                        "outline": "#6f797b",
                        "on-secondary-container": "#00743a",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#006d36",
                        "primary-fixed": "#a7eefc",
                        "on-surface": "#1a1c1a",
                        "on-error-container": "#93000a",
                        "tertiary": "#613309",
                        "on-tertiary-fixed": "#301400",
                        "secondary-container": "#83fba5",
                        "on-surface-variant": "#3f484a",
                        "tertiary-fixed-dim": "#ffb783",
                        "secondary-fixed": "#83fba5",
                        "surface-variant": "#e2e3df",
                        "surface-bright": "#f9faf6",
                        "surface-tint": "#156874",
                        "on-primary-fixed": "#001f24",
                        "inverse-primary": "#8bd2df",
                        "on-tertiary-fixed-variant": "#6b3a11",
                        "primary-fixed-dim": "#8bd2df",
                        "on-tertiary-container": "#ffbd8f",
                        "primary-container": "#005f6b",
                        "on-primary-container": "#90d6e4",
                        "on-secondary-fixed": "#00210c",
                        "tertiary-fixed": "#ffdcc5",
                        "surface-container-low": "#f3f4f0",
                        "on-primary": "#ffffff",
                        "surface-container": "#edeeea",
                        "surface-dim": "#d9dad7",
                        "secondary-fixed-dim": "#66dd8b",
                        "outline-variant": "#bec8ca",
                        "surface-container-high": "#e7e9e5",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#004e59",
                        "on-background": "#1a1c1a",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#f0f1ed",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2e312f",
                        "background": "#f9faf6",
                        "tertiary-container": "#7d491f",
                        "surface-container-highest": "#e2e3df"
                    },
                    fontFamily: {
                        "headline": ["Lexend"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .step-transition {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-radius {
            border-radius: 24px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col">
<!-- Progress Bar (Sutil Flow) -->
<div class="fixed top-0 left-0 w-full h-1 bg-surface-container-high z-[60]">
<div class="h-full bg-secondary transition-all duration-700 ease-in-out" style="width: 45.9%;"></div>
</div>
<!-- Top App Bar -->
<header class="flex items-center justify-between px-6 h-20 w-full no-border bg-neutral-100/50 backdrop-blur-md z-50">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-[#00464f]/5 transition-colors duration-300 scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[#00464f]">arrow_back</span>
</button>
</div>
<div class="font-lexend text-2xl font-black tracking-tighter text-[#00464f]">NURA</div>
<div class="w-10"></div> <!-- Placeholder for symmetry -->
</header>
<main class="flex-1 max-w-xl mx-auto px-6 pt-12 pb-32 w-full relative">
<!-- Contextual Leaf Decoration -->
<div class="absolute -top-10 -right-10 opacity-10 pointer-events-none select-none">
<span class="material-symbols-outlined text-[180px] text-secondary">eco</span>
</div>
<div class="mb-10">
<span class="font-headline text-sm font-bold uppercase tracking-[0.2em] text-tertiary/60 mb-2 block">Habits — Step 17/37</span>
<h1 class="font-headline text-4xl font-extrabold text-primary leading-tight tracking-tight">
                Quais hábitos quer mudar?
            </h1>
<p class="mt-4 text-on-surface-variant font-medium">O NURA Flow adapta-se às suas necessidades para criar transformações duradouras.</p>
</div>
<!-- Choice Grid -->
<div class="grid grid-cols-1 gap-4">
<!-- Selected Card -->
<button class="card-radius p-8 flex items-center justify-between bg-primary-fixed-dim group transition-all duration-300 hover:shadow-lg text-left">
<div class="flex flex-col gap-1">
<span class="font-headline text-xl font-bold text-primary">Comer à noite</span>
<span class="text-sm font-medium text-primary/70">Reduzir a ingestão calórica noturna</span>
</div>
<div class="w-8 h-8 rounded-full bg-secondary flex items-center justify-center text-white">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Unselected Cards -->
<button class="card-radius p-8 flex items-center justify-between bg-surface-container-low group transition-all duration-300 hover:bg-surface-container-high text-left">
<div class="flex flex-col gap-1">
<span class="font-headline text-xl font-bold text-primary">Beliscar o dia todo</span>
<span class="text-sm font-medium text-on-surface-variant">Controlar impulsos entre refeições</span>
</div>
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center text-primary/30 group-hover:text-primary/50">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
</div>
</button>
<button class="card-radius p-8 flex items-center justify-between bg-surface-container-low group transition-all duration-300 hover:bg-surface-container-high text-left">
<div class="flex flex-col gap-1">
<span class="font-headline text-xl font-bold text-primary">Doces em excesso</span>
<span class="text-sm font-medium text-on-surface-variant">Gerenciar o consumo de açúcar</span>
</div>
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center text-primary/30 group-hover:text-primary/50">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
</div>
</button>
<button class="card-radius p-8 flex items-center justify-between bg-surface-container-low group transition-all duration-300 hover:bg-surface-container-high text-left">
<div class="flex flex-col gap-1">
<span class="font-headline text-xl font-bold text-primary">Sedentarismo</span>
<span class="text-sm font-medium text-on-surface-variant">Incorporar movimento ao seu dia</span>
</div>
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center text-primary/30 group-hover:text-primary/50">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
</div>
</button>
</div>
<!-- Semantic Identity Mention -->
<div class="mt-12 text-center p-6 bg-surface-container-lowest card-radius shadow-sm border border-outline-variant/10">
<span class="material-symbols-outlined text-tertiary mb-2 block">auto_awesome</span>
<p class="text-sm text-on-surface-variant leading-relaxed">
                Suas escolhas definem como o <span class="font-bold text-primary">NURA Flow</span> irá sugerir novos caminhos para sua rotina.
            </p>
</div>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center max-w-md mx-auto mb-6 gap-4 px-8 pb-10">
<!-- Back Button -->
<button class="flex flex-row items-center justify-center text-[#00464f] bg-[#f5fcdf]/80 backdrop-blur-xl rounded-full px-10 py-4 hover:opacity-90 transition-all Active:scale-98">
<span class="material-symbols-outlined mr-2">chevron_left</span>
<span class="font-lexend text-[12px] font-medium uppercase tracking-wider">Back</span>
</button>
<!-- Continue Button (Active State) -->
<button class="flex flex-row items-center justify-center bg-[#00464f] text-[#f5fcdf] rounded-full px-10 py-4 shadow-lg hover:opacity-90 transition-all Active:scale-98">
<span class="font-lexend text-[12px] font-medium uppercase tracking-wider mr-2">Continue</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</nav>
</body></html>
