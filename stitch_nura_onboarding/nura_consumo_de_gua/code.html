<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NURA - Onboarding Water Intake</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#e2e3df",
                        "on-background": "#1a1c1a",
                        "on-primary-container": "#90d6e4",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#66dd8b",
                        "on-secondary-container": "#00743a",
                        "on-secondary": "#ffffff",
                        "surface-container": "#edeeea",
                        "outline": "#6f797b",
                        "secondary-container": "#83fba5",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2e312f",
                        "inverse-primary": "#8bd2df",
                        "on-surface-variant": "#3f484a",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#005227",
                        "tertiary-container": "#7d491f",
                        "surface": "#f9faf6",
                        "on-surface": "#1a1c1a",
                        "primary": "#00464f",
                        "primary-fixed-dim": "#8bd2df",
                        "surface-tint": "#156874",
                        "tertiary-fixed": "#ffdcc5",
                        "surface-container-high": "#e7e9e5",
                        "on-tertiary-fixed-variant": "#6b3a11",
                        "tertiary-fixed-dim": "#ffb783",
                        "on-primary-fixed": "#001f24",
                        "secondary": "#006d36",
                        "on-primary-fixed-variant": "#004e59",
                        "surface-dim": "#d9dad7",
                        "on-tertiary-fixed": "#301400",
                        "on-primary": "#ffffff",
                        "background": "#f9faf6",
                        "primary-container": "#005f6b",
                        "tertiary": "#613309",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f3f4f0",
                        "inverse-on-surface": "#f0f1ed",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#a7eefc",
                        "surface-variant": "#e2e3df",
                        "on-tertiary-container": "#ffbd8f",
                        "secondary-fixed": "#83fba5",
                        "on-secondary-fixed": "#00210c",
                        "surface-bright": "#f9faf6",
                        "outline-variant": "#bec8ca"
                    },
                    fontFamily: {
                        "headline": ["Lexend"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-mesh-gradient {
            background-color: #f9faf6;
            background-image: radial-gradient(at 0% 0%, rgba(0, 70, 79, 0.03) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(0, 109, 54, 0.03) 0px, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body selection:bg-primary-fixed selection:text-primary">
<!-- Top Progress Bar -->
<div class="fixed top-0 left-0 w-full h-1 bg-surface-container-high z-[60]">
<div class="h-full bg-secondary w-3/4 transition-all duration-700 ease-in-out"></div>
</div>
<!-- Top Navigation Shell (Suppressed for focused onboarding journey) -->
<nav class="fixed top-0 w-full z-50 flex items-center justify-between px-8 h-20 w-full bg-stone-50/70 dark:bg-stone-950/70 backdrop-blur-xl">
<div class="text-2xl font-bold tracking-tighter text-teal-900 dark:text-teal-500 font-headline">NURA</div>
<button class="p-2 rounded-full hover:bg-stone-200/50 transition-all duration-300">
<span class="material-symbols-outlined text-teal-900" data-icon="close">close</span>
</button>
</nav>
<main class="min-h-screen pt-28 pb-32 px-6 flex flex-col items-center justify-center bg-mesh-gradient overflow-x-hidden">
<!-- Contextual Leaf Decoration -->
<div class="fixed -top-20 -right-20 opacity-20 pointer-events-none">
<span class="material-symbols-outlined text-[20rem] text-secondary-container" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<div class="w-full max-w-xl flex flex-col items-center">
<!-- Subtle Water Drop Icon -->
<div class="mb-12 flex items-center justify-center w-24 h-24 rounded-full bg-surface-container-lowest shadow-[0_16px_32px_rgba(0,0,0,0.02)] border border-outline-variant/10">
<span class="material-symbols-outlined text-5xl text-primary" data-icon="water_drop" style="font-variation-settings: 'FILL' 1;">water_drop</span>
</div>
<!-- Header Section -->
<div class="text-center mb-16 px-4">
<h1 class="text-4xl md:text-5xl font-headline font-bold tracking-tight text-primary leading-tight">
                    Bebe água suficiente?
                </h1>
<p class="mt-6 text-on-surface-variant text-lg max-w-sm mx-auto leading-relaxed">
                    A hidratação é o pilar invisível da sua performance cognitiva e física.
                </p>
</div>
<!-- Elegance Selector Cards -->
<div class="w-full space-y-4">
<!-- Option: Sim -->
<button class="group w-full flex items-center justify-between p-8 rounded-xl bg-surface-container-low hover:bg-surface-container-high transition-all duration-300 ease-in-out text-left border border-transparent focus:outline-none focus:ring-2 focus:ring-primary/20">
<div class="flex items-center gap-6">
<div class="w-12 h-12 rounded-full bg-surface-container-lowest flex items-center justify-center transition-colors group-hover:bg-primary-container/10">
<span class="material-symbols-outlined text-primary" data-icon="check_circle">check_circle</span>
</div>
<span class="text-xl font-headline font-medium text-on-surface">Sim</span>
</div>
</button>
<!-- Option: Não -->
<button class="group w-full flex items-center justify-between p-8 rounded-xl bg-primary-fixed-dim/10 border border-primary-fixed-dim transition-all duration-300 ease-in-out text-left focus:outline-none">
<div class="flex items-center gap-6">
<div class="w-12 h-12 rounded-full bg-primary-fixed-dim flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="close" style="font-variation-settings: 'FILL' 0;">close</span>
</div>
<span class="text-xl font-headline font-semibold text-primary">Não</span>
</div>
<span class="material-symbols-outlined text-secondary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Option: Não tenho a certeza -->
<button class="group w-full flex items-center justify-between p-8 rounded-xl bg-surface-container-low hover:bg-surface-container-high transition-all duration-300 ease-in-out text-left border border-transparent focus:outline-none focus:ring-2 focus:ring-primary/20">
<div class="flex items-center gap-6">
<div class="w-12 h-12 rounded-full bg-surface-container-lowest flex items-center justify-center transition-colors group-hover:bg-primary-container/10">
<span class="material-symbols-outlined text-primary" data-icon="question_mark">question_mark</span>
</div>
<span class="text-xl font-headline font-medium text-on-surface">Não tenho a certeza</span>
</div>
</button>
</div>
<!-- Footer Action Section -->
<div class="mt-20 w-full">
<button class="w-full h-16 bg-primary text-on-primary rounded-xl font-headline font-semibold text-lg flex items-center justify-center gap-3 shadow-lg shadow-primary/10 hover:brightness-110 active:scale-[0.98] transition-all duration-300 group">
                    Continuar
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="mt-6 text-center text-on-surface-variant/60 text-sm font-medium">
                    Fase 4 de 6 • Hidratação &amp; Fluxo
                </p>
</div>
</div>
</main>
<!-- Contextual Leaf (Bottom Left) -->
<div class="fixed -bottom-24 -left-24 opacity-10 pointer-events-none transform -rotate-45">
<span class="material-symbols-outlined text-[25rem] text-secondary" style="font-variation-settings: 'FILL' 0;">spa</span>
</div>
</body></html>
