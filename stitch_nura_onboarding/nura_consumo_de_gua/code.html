<!DOCTYPE html>

<html class="light" lang="pt-PT"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NURA - Consumo de Água</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                extend: {
                    colors: {
                        "on-secondary-fixed-variant": "#005227",
                        "primary": "#00464f",
                        "on-secondary": "#ffffff",
                        "surface": "#f9faf6",

                        "secondary": "#006d36",

                        "tertiary": "#613309",
                        "on-tertiary-fixed": "#301400",
                        "secondary-container": "#83fba5",

                        "tertiary-fixed-dim": "#ffb783",
                        "secondary-fixed": "#83fba5",
                        "surface-variant": "#e2e3df",
                        "surface-bright": "#f9faf6",
                        "surface-tint": "#156874",
                        "on-primary-fixed": "#001f24",
                        "inverse-primary": "#8bd2df",
                        "on-tertiary-fixed-variant": "#6b3a11",
                        "primary-fixed-dim": "#8bd2df",
                        "on-tertiary-container": "#ffbd8f",
                        "primary-container": "#005f6b",
                        "on-primary-container": "#90d6e4",
                        "on-secondary-fixed": "#00210c",
                        "tertiary-fixed": "#ffdcc5",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f9faf6;
        }
        .font-lexend { font-family: 'Lexend', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen text-on-surface">
<!-- Sutil Flow Progress Bar -->
<div class="fixed top-0 left-0 w-full h-1 bg-surface-container-high z-[60]">
<div class="h-full bg-secondary transition-all duration-700 ease-in-out" style="width: 37.8%;"></div> <!-- Step 14 of 37 -->
</div>
<!-- TopAppBar -->
<header class="bg-neutral-100/50 dark:bg-slate-800/50 backdrop-blur-md flex items-center justify-between px-6 h-20 w-full fixed top-0 z-50">
<button class="text-[#00464f] dark:text-teal-400 hover:bg-[#00464f]/5 transition-colors duration-300 scale-95 active:scale-90 transition-transform p-2 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-lexend text-2xl font-black tracking-tighter text-[#00464f] dark:text-teal-500">NURA</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<main class="flex-grow flex flex-col items-center justify-center px-6 pt-24 pb-32 max-w-2xl mx-auto w-full">
<!-- Contextual Leaf Decoration -->
<div class="fixed top-1/4 -right-20 opacity-20 pointer-events-none transform rotate-12">
<span class="material-symbols-outlined text-[300px] text-secondary-container" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<!-- Editorial Content -->
<div class="w-full mb-12 relative z-10">
<p class="font-lexend text-sm tracking-widest uppercase font-bold text-tertiary mb-2">Phase 4: Hydration</p>
<h2 class="font-lexend text-4xl md:text-5xl font-bold text-primary leading-tight mb-4">Bebe água suficiente?</h2>
<p class="text-on-surface-variant text-lg max-w-md">O NURA Flow adapta-se ao seu ritmo biológico. A hidratação é o combustível da clareza mental.</p>
</div>
<!-- Options Container (Selective Option Cards) -->
<div class="w-full space-y-4 relative z-10">
<!-- Option: Sim -->
<button class="group w-full text-left bg-surface-container-lowest hover:bg-surface-container-low transition-all duration-300 p-8 rounded-lg flex items-center justify-between group">
<div class="flex items-center gap-6">
<div class="w-14 h-14 rounded-full bg-primary/5 flex items-center justify-center text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">water_full</span>
</div>
<div>
<span class="font-lexend text-xl font-semibold text-primary block">Sim</span>
<span class="text-sm text-on-surface-variant">Mantenho-me hidratado(a) regularmente.</span>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant group-hover:border-secondary transition-colors"></div>
</button>
<!-- Option: Não (Selected state simulation) -->
<button class="w-full text-left bg-primary-fixed-dim/30 ring-2 ring-secondary p-8 rounded-lg flex items-center justify-between transition-all duration-300">
<div class="flex items-center gap-6">
<div class="w-14 h-14 rounded-full bg-secondary text-on-secondary flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">water_medium</span>
</div>
<div>
<span class="font-lexend text-xl font-semibold text-primary block">Não</span>
<span class="text-sm text-on-surface-variant">Esqueço-me de beber água com frequência.</span>
</div>
</div>
<div class="w-8 h-8 rounded-full bg-secondary flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary text-lg" style="font-variation-settings: 'FILL' 0; font-weight: 700;">check</span>
</div>
</button>
<!-- Option: Não tenho a certeza -->
<button class="group w-full text-left bg-surface-container-lowest hover:bg-surface-container-low transition-all duration-300 p-8 rounded-lg flex items-center justify-between">
<div class="flex items-center gap-6">
<div class="w-14 h-14 rounded-full bg-tertiary/5 flex items-center justify-center text-tertiary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">question_mark</span>
</div>
<div>
<span class="font-lexend text-xl font-semibold text-primary block">Não tenho a certeza</span>
<span class="text-sm text-on-surface-variant">Não costumo monitorizar o consumo.</span>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant group-hover:border-secondary transition-colors"></div>
</button>
</div>
<!-- Identity Footer Tag -->
<div class="mt-16 text-center opacity-40 select-none">
<span class="font-lexend text-xs tracking-[0.3em] uppercase font-light text-primary">NURA Flow Identity</span>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center max-w-md mx-auto mb-6 gap-4 px-8 pb-10 pointer-events-none">
<!-- Back Button (Inactive Style) -->
<button class="pointer-events-auto flex flex-row items-center justify-center text-[#00464f] bg-[#f5fcdf]/80 backdrop-blur-xl rounded-full px-10 py-4 shadow-[0_-16px_32px_rgba(26,28,26,0.04)] hover:opacity-90 transition-opacity duration-300 active:scale-95 transition-all cubic-bezier(0.4, 0, 0.2, 1)">
<span class="material-symbols-outlined mr-2">chevron_left</span>
<span class="font-lexend text-[12px] font-medium uppercase tracking-wider">Back</span>
</button>
<!-- Continue Button (Active Style) -->
<button class="pointer-events-auto flex flex-row items-center justify-center bg-[#00464f] text-[#f5fcdf] rounded-full px-10 py-4 shadow-lg hover:opacity-90 transition-opacity duration-300 active:scale-95 transition-all cubic-bezier(0.4, 0, 0.2, 1)">
<span class="font-lexend text-[12px] font-medium uppercase tracking-wider mr-2">Continue</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</nav>
<!-- Background texture layer -->
<div class="fixed inset-0 -z-10 opacity-[0.03] pointer-events-none bg-[url('https://www.transparenttextures.com/patterns/felt.png')]" data-alt="Subtle felt paper texture overlay"></div>
</body></html>
