<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface font-body selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Progress Indicator: Sutil Flow -->
<div class="fixed top-0 left-0 w-full h-1 bg-surface-container-high z-[60]">
<div class="h-full bg-secondary transition-all duration-700 ease-out" style="width: 64.8%;"></div>
</div>
<!-- TopAppBar -->
<header class="bg-[#f5fcdf] dark:bg-stone-900 w-full top-0 px-6 py-4 flex items-center justify-between w-full max-w-screen-xl mx-auto z-50">
<button class="text-[#00464f] dark:text-teal-400 active:scale-95 transition-transform p-2 hover:bg-[#00464f]/5 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Lexend'] font-black text-2xl tracking-widest text-[#00464f] dark:text-teal-400">NURA</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="relative min-h-[calc(100vh-80px)] flex flex-col items-center px-6 pt-12 pb-32 max-w-2xl mx-auto">
<!-- Contextual Leaf (Decorative) -->
<div class="fixed top-1/4 -right-12 w-64 h-64 bg-secondary-container/20 rounded-full blur-3xl -z-10 pointer-events-none"></div>
<div class="fixed bottom-1/4 -left-12 w-48 h-48 bg-primary-container/10 rounded-full blur-3xl -z-10 pointer-events-none"></div>
<!-- Editorial Header -->
<section class="w-full text-center space-y-4 mb-16">
<span class="font-headline font-medium text-on-surface-variant tracking-widest text-sm uppercase">Fase 6 • Jornada Nura</span>
<h2 class="font-headline font-bold text-4xl md:text-5xl text-primary leading-tight">Qual é o seu peso objetivo?</h2>
<p class="text-on-surface-variant text-lg max-w-md mx-auto">Sua meta ajuda a calibrar o ritmo do seu plano de bem-estar.</p>
</section>
<!-- Main Input Area: Numerical Elegance -->
<section class="w-full flex flex-col items-center">
<div class="relative group">
<!-- Large Numerical Input -->
<div class="flex items-baseline justify-center gap-2">
<input class="w-48 text-center font-headline font-bold text-8xl md:text-9xl bg-transparent border-none focus:ring-0 text-primary p-0 placeholder:text-surface-container-highest transition-colors" max="300" min="30" placeholder="70" type="number"/>
<span class="font-headline font-semibold text-3xl text-on-surface-variant">kg</span>
</div>
<!-- Underline Focus Transition -->
<div class="w-full h-0.5 bg-surface-container-highest mt-4 group-focus-within:bg-primary transition-all duration-500 scale-x-90 group-focus-within:scale-x-100"></div>
</div>
<!-- Stepper Controls (Tactile) -->
<div class="mt-12 flex items-center gap-12">
<button class="w-16 h-16 rounded-full flex items-center justify-center text-primary bg-surface-container-low hover:bg-surface-container-high active:scale-90 transition-all duration-300">
<span class="material-symbols-outlined text-3xl">remove</span>
</button>
<button class="w-16 h-16 rounded-full flex items-center justify-center text-primary bg-surface-container-low hover:bg-surface-container-high active:scale-90 transition-all duration-300">
<span class="material-symbols-outlined text-3xl">add</span>
</button>
</div>
</section>
<!-- Progress Counter -->
<div class="mt-auto pt-16 text-center">
<p class="font-label text-sm text-on-surface-variant/60 tracking-tighter">PASSO 24 DE 37</p>
</div>
</main>
<!-- BottomNavBar (Transactional Style) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex flex-col items-center justify-center px-6 pb-10 pt-4 bg-transparent">
<div class="w-full max-w-md">
<button class="flex items-center justify-center bg-gradient-to-r from-[#00464f] to-[#005f6b] text-white rounded-full h-16 w-full shadow-lg hover:brightness-110 active:scale-[0.98] transition-all duration-300">
<span class="font-['Lexend'] font-semibold text-base mr-2">Próximo passo</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</nav>
<!-- Background Texture/Abstract -->
<div class="fixed inset-0 -z-20 bg-surface">
<div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(#00464f 0.5px, transparent 0.5px); background-size: 24px 24px;"></div>
</div>
