<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-highest": "#e2e3df",
              "on-background": "#1a1c1a",
              "on-primary-container": "#90d6e4",
              "on-tertiary": "#ffffff",
              "on-error-container": "#93000a",
              "secondary-fixed-dim": "#66dd8b",
              "on-secondary-container": "#00743a",
              "on-secondary": "#ffffff",
              "surface-container": "#edeeea",
              "outline": "#6f797b",
              "secondary-container": "#83fba5",
              "on-error": "#ffffff",
              "inverse-surface": "#2e312f",
              "inverse-primary": "#8bd2df",
              "on-surface-variant": "#3f484a",
              "error": "#ba1a1a",
              "on-secondary-fixed-variant": "#005227",
              "tertiary-container": "#7d491f",
              "surface": "#f9faf6",
              "on-surface": "#1a1c1a",
              "primary": "#00464f",
              "primary-fixed-dim": "#8bd2df",
              "surface-tint": "#156874",
              "tertiary-fixed": "#ffdcc5",
              "surface-container-high": "#e7e9e5",
              "on-tertiary-fixed-variant": "#6b3a11",
              "tertiary-fixed-dim": "#ffb783",
              "on-primary-fixed": "#001f24",
              "secondary": "#006d36",
              "on-primary-fixed-variant": "#004e59",
              "surface-dim": "#d9dad7",
              "on-tertiary-fixed": "#301400",
              "on-primary": "#ffffff",
              "background": "#f9faf6",
              "primary-container": "#005f6b",
              "tertiary": "#613309",
              "error-container": "#ffdad6",
              "surface-container-low": "#f3f4f0",
              "inverse-on-surface": "#f0f1ed",
              "surface-container-lowest": "#ffffff",
              "primary-fixed": "#a7eefc",
              "surface-variant": "#e2e3df",
              "on-tertiary-container": "#ffbd8f",
              "secondary-fixed": "#83fba5",
              "on-secondary-fixed": "#00210c",
              "surface-bright": "#f9faf6",
              "outline-variant": "#bec8ca"
            },
            fontFamily: {
              "headline": ["Lexend"],
              "body": ["Plus Jakarta Sans"],
              "label": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }
        .active-card {
            background-color: #8bd2df; /* primary-fixed-dim */
        }
        .leaf-bg {
            position: fixed;
            top: 10%;
            right: -5%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(131, 251, 165, 0.15) 0%, rgba(249, 250, 246, 0) 70%);
            border-radius: 45% 55% 30% 70% / 60% 30% 70% 40%;
            z-index: -1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface min-h-screen selection:bg-primary-fixed flex flex-col">
<div class="leaf-bg"></div>
<header class="bg-stone-50/70 dark:bg-stone-950/70 backdrop-blur-xl fixed top-0 w-full z-50 flex items-center justify-between px-8 h-20 w-full no-border tonal-shift bg-stone-100/50 dark:bg-stone-900/50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-teal-900 dark:text-teal-500 cursor-pointer hover:bg-stone-200/50 p-2 rounded-full transition-all">close</span>
</div>
<h1 class="font-lexend tracking-tight font-medium text-2xl font-bold tracking-tighter text-teal-900 dark:text-teal-500">NURA</h1>
<div class="w-10"></div>
</header>
<div class="fixed top-0 left-0 w-full h-1 bg-surface-container-high z-[60]">
<div class="bg-secondary h-full transition-all duration-700 ease-out" style="width: 60%;"></div>
</div>
<main class="flex-grow pt-32 pb-40 px-6 max-w-2xl mx-auto w-full flex flex-col justify-center">
<div class="mb-12 space-y-4">
<h2 class="font-headline text-4xl md:text-5xl text-primary font-bold leading-tight tracking-tight">Onde você costuma comer?</h2>
<p class="text-on-surface-variant text-lg leading-relaxed max-w-md">Para personalizar seu plano alimentar, precisamos entender sua rotina.</p>
</div>
<div class="space-y-6">
<button class="w-full group bg-surface-container-low hover:bg-surface-container-highest transition-all duration-300 ease-in-out p-8 rounded-lg text-left flex items-center gap-8 group">
<div class="w-16 h-16 rounded-full bg-surface-container-highest flex items-center justify-center transition-transform duration-500 group-hover:scale-110">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="home">home</span>
</div>
<div class="flex-grow">
<p class="font-headline text-xl text-primary font-medium">Em casa</p>
</div>
<div class="w-6 h-6 border-2 border-outline-variant rounded-full group-focus:border-secondary flex items-center justify-center">
<div class="w-3 h-3 bg-secondary rounded-full opacity-0 group-active:opacity-100 transition-opacity"></div>
</div>
</button>
<button class="w-full group bg-primary-fixed-dim transition-all duration-300 ease-in-out p-8 rounded-lg text-left flex items-center gap-8 ring-2 ring-primary-container/20">
<div class="w-16 h-16 rounded-full bg-surface-container-lowest flex items-center justify-center transition-transform duration-500 group-hover:scale-110">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="work">work</span>
</div>
<div class="flex-grow">
<p class="font-headline text-xl text-primary font-semibold">No trabalho</p>
</div>
<div class="w-8 h-8 bg-secondary rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-surface text-lg" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<button class="w-full group bg-surface-container-low hover:bg-surface-container-highest transition-all duration-300 ease-in-out p-8 rounded-lg text-left flex items-center gap-8">
<div class="w-16 h-16 rounded-full bg-surface-container-highest flex items-center justify-center transition-transform duration-500 group-hover:scale-110">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="restaurant">restaurant</span>
</div>
<div class="flex-grow">
<p class="font-headline text-xl text-primary font-medium">Restaurantes/Rua</p>
</div>
<div class="w-6 h-6 border-2 border-outline-variant rounded-full flex items-center justify-center">
</div>
</button>
</div>
</main>
<footer class="fixed bottom-0 left-0 w-full bg-surface/80 backdrop-blur-2xl px-6 py-10 z-40">
<div class="max-w-2xl mx-auto">
<button class="w-full bg-primary text-on-primary font-headline text-lg font-semibold h-16 rounded-xl shadow-lg shadow-primary/10 hover:shadow-xl hover:translate-y-[-2px] transition-all duration-300 active:scale-[0.98] flex items-center justify-center gap-2">
                Continuar
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</footer>
<div class="fixed top-1/2 left-0 -translate-x-1/2 -translate-y-1/2 opacity-20 pointer-events-none">
<div class="w-[500px] h-[500px] bg-secondary-container blur-[120px] rounded-full"></div>
</div>
</body></html>
