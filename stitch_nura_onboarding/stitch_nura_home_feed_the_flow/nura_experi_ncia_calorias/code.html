<!DOCTYPE html>

<html class="light" lang="pt-PT"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-highest": "#e2e3df",
              "on-background": "#1a1c1a",
              "on-primary-container": "#90d6e4",
              "on-tertiary": "#ffffff",
              "on-error-container": "#93000a",
              "secondary-fixed-dim": "#66dd8b",
              "on-secondary-container": "#00743a",
              "on-secondary": "#ffffff",
              "surface-container": "#edeeea",
              "outline": "#6f797b",
              "secondary-container": "#83fba5",
              "on-error": "#ffffff",
              "inverse-surface": "#2e312f",
              "inverse-primary": "#8bd2df",
              "on-surface-variant": "#3f484a",
              "error": "#ba1a1a",
              "on-secondary-fixed-variant": "#005227",
              "tertiary-container": "#7d491f",
              "surface": "#f9faf6",
              "on-surface": "#1a1c1a",
              "primary": "#00464f",
              "primary-fixed-dim": "#8bd2df",
              "surface-tint": "#156874",
              "tertiary-fixed": "#ffdcc5",
              "surface-container-high": "#e7e9e5",
              "on-tertiary-fixed-variant": "#6b3a11",
              "tertiary-fixed-dim": "#ffb783",
              "on-primary-fixed": "#001f24",
              "secondary": "#006d36",
              "on-primary-fixed-variant": "#004e59",
              "surface-dim": "#d9dad7",
              "on-tertiary-fixed": "#301400",
              "on-primary": "#ffffff",
              "background": "#f9faf6",
              "primary-container": "#005f6b",
              "tertiary": "#613309",
              "error-container": "#ffdad6",
              "surface-container-low": "#f3f4f0",
              "inverse-on-surface": "#f0f1ed",
              "surface-container-lowest": "#ffffff",
              "primary-fixed": "#a7eefc",
              "surface-variant": "#e2e3df",
              "on-tertiary-container": "#ffbd8f",
              "secondary-fixed": "#83fba5",
              "on-secondary-fixed": "#00210c",
              "surface-bright": "#f9faf6",
              "outline-variant": "#bec8ca"
            },
            fontFamily: {
              "headline": ["Lexend"],
              "body": ["Plus Jakarta Sans"],
              "label": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f9faf6; }
        .font-lexend { font-family: 'Lexend', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .custom-glass { backdrop-filter: blur(20px); background: rgba(255, 255, 255, 0.7); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface min-h-screen flex flex-col">
<!-- Progress Bar (Sutil Flow) -->
<div class="fixed top-0 left-0 w-full h-1 bg-surface-container-high z-[60]">
<div class="h-full bg-secondary w-1/3 transition-all duration-700 ease-in-out"></div>
</div>
<!-- Top Navigation Anchor (Manual suppression of BottomNav due to Transactional state) -->
<header class="bg-stone-50/70 dark:bg-stone-950/70 backdrop-blur-xl fixed top-0 w-full z-50 no-border tonal-shift bg-stone-100/50 dark:bg-stone-900/50 flat no shadows flex items-center justify-between px-8 h-20 w-full">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-teal-900 dark:text-teal-500 scale-95 duration-300 cursor-pointer">close</span>
</div>
<div class="text-2xl font-bold tracking-tighter text-teal-900 dark:text-teal-500 font-lexend tracking-tight font-medium">NURA</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-32 pb-40 px-6 max-w-2xl mx-auto w-full flex flex-col items-center justify-center relative overflow-hidden">
<!-- Contextual Leaf (Decorative) -->
<div class="absolute -top-20 -right-20 w-64 h-64 bg-secondary-container opacity-20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-10 -left-10 w-48 h-48 bg-primary-fixed-dim opacity-10 rounded-full blur-2xl pointer-events-none"></div>
<!-- Headline (The Hook) -->
<section class="text-center mb-16 space-y-4">
<h1 class="font-headline text-4xl md:text-5xl font-extrabold text-primary tracking-tight leading-tight">
                Qual é a sua experiência com contagem de calorias?
            </h1>
<p class="text-on-surface-variant font-body text-lg max-w-md mx-auto">
                Personalizamos o seu percurso com base no seu conhecimento atual.
            </p>
</section>
<!-- Selective Option Cards (The Elegance Selector) -->
<div class="w-full space-y-6">
<!-- Option 1: Beginner -->
<button class="w-full group text-left p-8 rounded-[1.5rem] bg-surface-container-low transition-all duration-300 ease-in-out hover:bg-surface-container-highest flex items-center justify-between">
<div class="space-y-1">
<span class="block font-headline text-xl font-semibold text-primary">Iniciante</span>
<span class="block font-body text-on-surface-variant">(nunca tentei)</span>
</div>
<div class="w-8 h-8 rounded-full border-2 border-outline-variant group-hover:border-primary transition-colors flex items-center justify-center">
<div class="w-4 h-4 rounded-full bg-secondary opacity-0 transition-opacity"></div>
</div>
</button>
<!-- Option 2: Intermediate (Active State Mockup) -->
<button class="w-full group text-left p-8 rounded-[1.5rem] bg-primary-fixed-dim ring-2 ring-secondary transition-all duration-500 ease-in-out flex items-center justify-between">
<div class="space-y-1">
<span class="block font-headline text-xl font-semibold text-primary">Intermédio</span>
<span class="block font-body text-primary/80">(já tentei)</span>
</div>
<div class="w-8 h-8 rounded-full bg-secondary flex items-center justify-center transition-transform duration-300 scale-110">
<span class="material-symbols-outlined text-on-secondary text-lg" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Option 3: Pro -->
<button class="w-full group text-left p-8 rounded-[1.5rem] bg-surface-container-low transition-all duration-300 ease-in-out hover:bg-surface-container-highest flex items-center justify-between">
<div class="space-y-1">
<span class="block font-headline text-xl font-semibold text-primary">Experiente</span>
<span class="block font-body text-on-surface-variant">(faço regularmente)</span>
</div>
<div class="w-8 h-8 rounded-full border-2 border-outline-variant group-hover:border-primary transition-colors flex items-center justify-center">
<div class="w-4 h-4 rounded-full bg-secondary opacity-0 transition-opacity"></div>
</div>
</button>
</div>
</main>
<!-- Fixed Action Bar (The Digital Sanctuary) -->
<div class="fixed bottom-0 left-0 w-full px-6 pb-12 pt-8 custom-glass z-40">
<div class="max-w-2xl mx-auto">
<button class="w-full h-16 bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline text-lg font-bold rounded-xl shadow-lg hover:brightness-110 active:scale-[0.98] transition-all duration-300 ease-in-out flex items-center justify-center gap-3">
                Continuar
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center mt-4 text-xs font-label text-on-surface-variant uppercase tracking-widest opacity-60">
                Passo 1 de 6
            </p>
</div>
</div>
</body></html>
