<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-highest": "#e2e3df",
              "on-background": "#1a1c1a",
              "on-primary-container": "#90d6e4",
              "on-tertiary": "#ffffff",
              "on-error-container": "#93000a",
              "secondary-fixed-dim": "#66dd8b",
              "on-secondary-container": "#00743a",
              "on-secondary": "#ffffff",
              "surface-container": "#edeeea",
              "outline": "#6f797b",
              "secondary-container": "#83fba5",
              "on-error": "#ffffff",
              "inverse-surface": "#2e312f",
              "inverse-primary": "#8bd2df",
              "on-surface-variant": "#3f484a",
              "error": "#ba1a1a",
              "on-secondary-fixed-variant": "#005227",
              "tertiary-container": "#7d491f",
              "surface": "#f9faf6",
              "on-surface": "#1a1c1a",
              "primary": "#00464f",
              "primary-fixed-dim": "#8bd2df",
              "surface-tint": "#156874",
              "tertiary-fixed": "#ffdcc5",
              "surface-container-high": "#e7e9e5",
              "on-tertiary-fixed-variant": "#6b3a11",
              "tertiary-fixed-dim": "#ffb783",
              "on-primary-fixed": "#001f24",
              "secondary": "#006d36",
              "on-primary-fixed-variant": "#004e59",
              "surface-dim": "#d9dad7",
              "on-tertiary-fixed": "#301400",
              "on-primary": "#ffffff",
              "background": "#f9faf6",
              "primary-container": "#005f6b",
              "tertiary": "#613309",
              "error-container": "#ffdad6",
              "surface-container-low": "#f3f4f0",
              "inverse-on-surface": "#f0f1ed",
              "surface-container-lowest": "#ffffff",
              "primary-fixed": "#a7eefc",
              "surface-variant": "#e2e3df",
              "on-tertiary-container": "#ffbd8f",
              "secondary-fixed": "#83fba5",
              "on-secondary-fixed": "#00210c",
              "surface-bright": "#f9faf6",
              "outline-variant": "#bec8ca"
            },
            fontFamily: {
              "headline": ["Lexend"],
              "body": ["Plus Jakarta Sans"],
              "label": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        h1, h2, h3 {
            font-family: 'Lexend', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center">
<!-- Progress Bar Anchor -->
<div class="fixed top-0 left-0 w-full h-1 bg-surface-container-high z-[60]">
<div class="h-full bg-secondary w-1/3 transition-all duration-700 ease-in-out"></div>
</div>
<!-- Top Navigation Shell -->
<header class="fixed top-0 w-full z-50 bg-stone-50/70 dark:bg-stone-950/70 backdrop-blur-xl flex items-center justify-between px-8 h-20">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-teal-900 dark:text-teal-500 hover:bg-stone-200/50 dark:hover:bg-stone-800/50 p-2 rounded-full transition-all cursor-pointer" data-icon="close">close</span>
</div>
<div class="text-2xl font-bold tracking-tighter text-teal-900 dark:text-teal-500 font-lexend">NURA</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-1 flex flex-col items-center justify-center w-full max-w-2xl px-6 pt-32 pb-40">
<!-- Contextual Leaf Decoration -->
<div class="fixed top-1/4 -right-12 opacity-20 pointer-events-none transform rotate-12">
<span class="material-symbols-outlined text-[12rem] text-secondary-container" data-icon="eco">eco</span>
</div>
<!-- Editorial Content -->
<section class="w-full text-center mb-16 space-y-6">
<h1 class="text-4xl md:text-5xl font-bold text-primary tracking-tight leading-tight">
                Já conhece o <span class="text-secondary">Jejum</span> Intermitente?
            </h1>
<p class="text-on-surface-variant text-lg md:text-xl font-light max-w-md mx-auto leading-relaxed">
                Personalizamos sua jornada com base na sua experiência atual com o método.
            </p>
</section>
<!-- Selection Grid -->
<div class="w-full grid grid-cols-1 gap-6">
<!-- Option: Sim -->
<button class="group relative w-full p-8 rounded-xl bg-surface-container-low transition-all duration-300 hover:bg-surface-container-highest flex items-center justify-between text-left overflow-hidden">
<div class="flex flex-col gap-1 z-10">
<span class="text-2xl font-semibold text-primary font-headline">Sim</span>
<span class="text-on-surface-variant font-light">Já pratiquei ou conheço os fundamentos.</span>
</div>
<div class="w-12 h-12 rounded-full border-2 border-outline-variant group-focus:border-secondary group-focus:bg-secondary/10 flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-transparent group-focus:text-secondary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Subtle Gradient Glow on Hover -->
<div class="absolute inset-0 bg-gradient-to-r from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
<!-- Option: Não -->
<button class="group relative w-full p-8 rounded-xl bg-surface-container-low transition-all duration-300 hover:bg-surface-container-highest flex items-center justify-between text-left overflow-hidden">
<div class="flex flex-col gap-1 z-10">
<span class="text-2xl font-semibold text-primary font-headline">Não</span>
<span class="text-on-surface-variant font-light">Gostaria de aprender do zero.</span>
</div>
<div class="w-12 h-12 rounded-full border-2 border-outline-variant group-focus:border-secondary group-focus:bg-secondary/10 flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-transparent group-focus:text-secondary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="absolute inset-0 bg-gradient-to-r from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
</div>
<!-- Task-Focused Action -->
<div class="mt-16 w-full flex justify-end">
<button class="flex items-center gap-4 bg-primary text-on-primary px-10 py-5 rounded-xl font-medium text-lg hover:shadow-lg transition-all duration-300 active:scale-95 group">
                Continuar
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</main>
<!-- Bottom Shell (Suppressed for focused onboarding journey) -->
<!-- The navigation shell is excluded as per the "Destination" Rule for focused linear/transactional tasks -->
<div class="fixed bottom-12 left-0 w-full flex justify-center pointer-events-none">
<div class="bg-surface-container-lowest/80 backdrop-blur-md px-6 py-3 rounded-full shadow-sm border border-outline-variant/10 text-on-surface-variant text-sm font-medium">
            Passo 2 de 8
        </div>
</div>
</body></html>
