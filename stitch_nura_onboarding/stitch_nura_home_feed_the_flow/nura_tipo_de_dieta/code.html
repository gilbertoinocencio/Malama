<!DOCTYPE html>

<html lang="pt"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NURA - Seleção de Dieta</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#e2e3df",
                        "on-background": "#1a1c1a",
                        "on-primary-container": "#90d6e4",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#66dd8b",
                        "on-secondary-container": "#00743a",
                        "on-secondary": "#ffffff",
                        "surface-container": "#edeeea",
                        "outline": "#6f797b",
                        "secondary-container": "#83fba5",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2e312f",
                        "inverse-primary": "#8bd2df",
                        "on-surface-variant": "#3f484a",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#005227",
                        "tertiary-container": "#7d491f",
                        "surface": "#f9faf6",
                        "on-surface": "#1a1c1a",
                        "primary": "#00464f",
                        "primary-fixed-dim": "#8bd2df",
                        "surface-tint": "#156874",
                        "tertiary-fixed": "#ffdcc5",
                        "surface-container-high": "#e7e9e5",
                        "on-tertiary-fixed-variant": "#6b3a11",
                        "tertiary-fixed-dim": "#ffb783",
                        "on-primary-fixed": "#001f24",
                        "secondary": "#006d36",
                        "on-primary-fixed-variant": "#004e59",
                        "surface-dim": "#d9dad7",
                        "on-tertiary-fixed": "#301400",
                        "on-primary": "#ffffff",
                        "background": "#f9faf6",
                        "primary-container": "#005f6b",
                        "tertiary": "#613309",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f3f4f0",
                        "inverse-on-surface": "#f0f1ed",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#a7eefc",
                        "surface-variant": "#e2e3df",
                        "on-tertiary-container": "#ffbd8f",
                        "secondary-fixed": "#83fba5",
                        "on-secondary-fixed": "#00210c",
                        "surface-bright": "#f9faf6",
                        "outline-variant": "#bec8ca"
                    },
                    fontFamily: {
                        "headline": ["Lexend"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f9faf6;
        }
        .headline-font {
            font-family: 'Lexend', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Progress Bar (Sutil Flow) -->
<div class="fixed top-0 left-0 w-full h-1 bg-surface-container-high z-[60]">
<div class="h-full bg-secondary w-3/4"></div>
</div>
<!-- Top Navigation Shell -->
<header class="bg-stone-50/70 dark:bg-stone-950/70 backdrop-blur-xl fixed top-0 w-full z-50 no-border tonal-shift bg-stone-100/50 dark:bg-stone-900/50">
<div class="flex items-center justify-between px-8 h-20 w-full">
<div class="text-2xl font-bold tracking-tighter text-teal-900 dark:text-teal-500 font-lexend">NURA</div>
<button class="p-2 hover:bg-stone-200/50 dark:hover:bg-stone-800/50 transition-all duration-300 ease-in-out rounded-full">
<span class="material-symbols-outlined text-teal-900 dark:text-teal-500" data-icon="close">close</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-32 pb-40 px-6 max-w-2xl mx-auto w-full">
<!-- Editorial Headline -->
<section class="mb-12">
<h1 class="headline-font text-4xl md:text-5xl font-bold text-primary tracking-tight leading-tight mb-4">
                Que tipo de dieta prefere?
            </h1>
<p class="text-on-surface-variant text-lg leading-relaxed max-w-md">
                Personalize a sua experiência nutritiva selecionando o estilo que melhor se adapta ao seu estilo de vida.
            </p>
</section>
<!-- Selection List (Elegance Selector) -->
<div class="space-y-4">
<!-- Option: Equilibrada (Selected State Example) -->
<button class="w-full flex items-center justify-between p-8 bg-primary-fixed-dim rounded-lg text-left transition-all duration-300 ease-in-out group shadow-sm">
<span class="headline-font text-xl font-medium text-primary">Equilibrada</span>
<span class="material-symbols-outlined text-secondary text-3xl" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Option: Vegetariana -->
<button class="w-full flex items-center justify-between p-8 bg-surface-container-low rounded-lg text-left transition-all duration-300 ease-in-out hover:bg-surface-container-highest group">
<span class="headline-font text-xl font-medium text-on-surface-variant group-hover:text-primary">Vegetariana</span>
<span class="material-symbols-outlined text-outline-variant opacity-0 group-hover:opacity-100 transition-opacity" data-icon="circle">circle</span>
</button>
<!-- Option: Vegan -->
<button class="w-full flex items-center justify-between p-8 bg-surface-container-low rounded-lg text-left transition-all duration-300 ease-in-out hover:bg-surface-container-highest group">
<span class="headline-font text-xl font-medium text-on-surface-variant group-hover:text-primary">Vegan</span>
<span class="material-symbols-outlined text-outline-variant opacity-0 group-hover:opacity-100 transition-opacity" data-icon="circle">circle</span>
</button>
<!-- Option: Paleo -->
<button class="w-full flex items-center justify-between p-8 bg-surface-container-low rounded-lg text-left transition-all duration-300 ease-in-out hover:bg-surface-container-highest group">
<span class="headline-font text-xl font-medium text-on-surface-variant group-hover:text-primary">Paleo</span>
<span class="material-symbols-outlined text-outline-variant opacity-0 group-hover:opacity-100 transition-opacity" data-icon="circle">circle</span>
</button>
<!-- Option: Cetogénica -->
<button class="w-full flex items-center justify-between p-8 bg-surface-container-low rounded-lg text-left transition-all duration-300 ease-in-out hover:bg-surface-container-highest group">
<span class="headline-font text-xl font-medium text-on-surface-variant group-hover:text-primary">Cetogénica</span>
<span class="material-symbols-outlined text-outline-variant opacity-0 group-hover:opacity-100 transition-opacity" data-icon="circle">circle</span>
</button>
<!-- Option: Rica em proteína -->
<button class="w-full flex items-center justify-between p-8 bg-surface-container-low rounded-lg text-left transition-all duration-300 ease-in-out hover:bg-surface-container-highest group">
<span class="headline-font text-xl font-medium text-on-surface-variant group-hover:text-primary">Rica em proteína</span>
<span class="material-symbols-outlined text-outline-variant opacity-0 group-hover:opacity-100 transition-opacity" data-icon="circle">circle</span>
</button>
<!-- Option: Baixa em carbo -->
<button class="w-full flex items-center justify-between p-8 bg-surface-container-low rounded-lg text-left transition-all duration-300 ease-in-out hover:bg-surface-container-highest group">
<span class="headline-font text-xl font-medium text-on-surface-variant group-hover:text-primary">Baixa em carbo</span>
<span class="material-symbols-outlined text-outline-variant opacity-0 group-hover:opacity-100 transition-opacity" data-icon="circle">circle</span>
</button>
</div>
</main>
<!-- Contextual Leaf (Decorative Element) -->
<div class="fixed bottom-24 -right-12 w-64 h-64 bg-secondary-container opacity-20 blur-3xl rounded-full -z-10 pointer-events-none"></div>
<!-- Action Footer -->
<footer class="fixed bottom-0 left-0 w-full p-8 bg-surface/80 backdrop-blur-md z-40">
<div class="max-w-2xl mx-auto flex justify-end">
<button class="bg-primary text-on-primary font-headline font-semibold py-4 px-12 rounded-xl text-lg hover:bg-primary-container transition-all duration-300 transform active:scale-95 shadow-xl shadow-primary/10 min-h-[4rem] min-w-[200px]">
                Continuar
            </button>
</div>
</footer>
</body></html>
