<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f9faf6;
        }
        .font-headline {
            font-family: 'Lexend', sans-serif;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary-fixed-variant": "#6b3a11",
                        "on-error-container": "#93000a",
                        "secondary": "#006d36",
                        "on-secondary-fixed-variant": "#005227",
                        "surface-container": "#edeeea",
                        "inverse-on-surface": "#f0f1ed",
                        "error-container": "#ffdad6",
                        "surface-bright": "#f9faf6",
                        "surface-variant": "#e2e3df",
                        "surface": "#f9faf6",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#f3f4f0",
                        "outline": "#6f797b",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#ffbd8f",
                        "surface-dim": "#d9dad7",
                        "surface-container-highest": "#e2e3df",
                        "tertiary": "#613309",
                        "primary-fixed": "#a7eefc",
                        "on-primary-container": "#90d6e4",
                        "background": "#f9faf6",
                        "tertiary-fixed-dim": "#ffb783",
                        "on-background": "#1a1c1a",
                        "secondary-fixed": "#83fba5",
                        "primary-fixed-dim": "#8bd2df",
                        "tertiary-container": "#7d491f",
                        "on-secondary-fixed": "#00210c",
                        "tertiary-fixed": "#ffdcc5",
                        "outline-variant": "#bec8ca",
                        "on-primary-fixed-variant": "#004e59",
                        "primary-container": "#005f6b",
                        "on-primary-fixed": "#001f24",
                        "on-surface-variant": "#3f484a",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#83fba5",
                        "on-secondary-container": "#00743a",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#301400",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#e7e9e5",
                        "inverse-surface": "#2e312f",
                        "surface-tint": "#156874",
                        "secondary-fixed-dim": "#66dd8b",
                        "on-surface": "#1a1c1a",
                        "inverse-primary": "#8bd2df",
                        "primary": "#00464f"
                    },
                    fontFamily: {
                        "headline": ["Lexend"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "1.5rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-6 h-16 bg-[#f5fcdf] dark:bg-slate-900 transition-all duration-300">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-[#005F6B]/5 transition-all duration-300 text-[#005F6B] group">
<span class="material-symbols-outlined transition-transform duration-300 group-active:scale-95" data-icon="arrow_back">arrow_back</span>
</button>
</div>
<div class="flex-grow text-center">
<span class="font-headline font-bold text-[#005F6B] tracking-widest text-2xl uppercase">NURA</span>
</div>
<div class="w-10"></div>
</header>
<!-- Progress Indicator -->
<div class="fixed top-16 left-0 w-full h-1 bg-surface-container-high z-50">
<div class="h-full bg-secondary transition-all duration-500" style="width: 54%;"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-6 max-w-2xl mx-auto w-full">
<!-- Header Section -->
<div class="mb-12 space-y-4">
<p class="text-sm font-label font-medium text-primary uppercase tracking-[0.2em] opacity-60">Passo 20 de 37</p>
<h1 class="font-headline text-4xl font-bold tracking-tight text-primary leading-tight">
                Nível de atividade física
            </h1>
<p class="text-on-surface-variant text-lg font-body">
                Como é o seu dia a dia?
            </p>
</div>
<!-- Activity Options Bento Grid-ish Layout -->
<div class="grid grid-cols-1 gap-4">
<!-- Option: Sedentário -->
<button class="group relative flex items-center p-6 bg-surface-container-low rounded-lg transition-all duration-300 hover:bg-surface-container-highest active:scale-[0.98] text-left">
<div class="flex-shrink-0 w-14 h-14 bg-surface-container-lowest rounded-full flex items-center justify-center mr-6 shadow-sm group-hover:bg-white">
<span class="material-symbols-outlined text-[#005F6B] text-2xl" data-icon="airline_seat_recline_normal">airline_seat_recline_normal</span>
</div>
<div class="flex-grow">
<h3 class="font-headline font-semibold text-xl text-primary mb-1">Sedentário</h3>
<p class="text-on-surface-variant text-sm leading-relaxed">Passo a maior parte do dia sentado, pouco esforço físico.</p>
</div>
</button>
<!-- Option: Levemente ativo -->
<button class="group relative flex items-center p-6 bg-surface-container-low rounded-lg transition-all duration-300 hover:bg-surface-container-highest active:scale-[0.98] text-left border-2 border-transparent hover:border-outline-variant/10">
<div class="flex-shrink-0 w-14 h-14 bg-surface-container-lowest rounded-full flex items-center justify-center mr-6 shadow-sm group-hover:bg-white">
<span class="material-symbols-outlined text-[#005F6B] text-2xl" data-icon="directions_walk">directions_walk</span>
</div>
<div class="flex-grow">
<h3 class="font-headline font-semibold text-xl text-primary mb-1">Levemente ativo</h3>
<p class="text-on-surface-variant text-sm leading-relaxed">Caminhadas leves ou atividades domésticas rotineiras.</p>
</div>
</button>
<!-- Option: Moderadamente ativo (PRE-SELECTED) -->
<button class="group relative flex items-center p-6 bg-primary-fixed-dim rounded-lg transition-all duration-300 active:scale-[0.98] text-left shadow-md">
<div class="flex-shrink-0 w-14 h-14 bg-on-primary rounded-full flex items-center justify-center mr-6 shadow-sm">
<span class="material-symbols-outlined text-secondary text-2xl" data-icon="fitness_center" data-weight="fill" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
</div>
<div class="flex-grow">
<div class="flex items-center justify-between">
<h3 class="font-headline font-semibold text-xl text-primary mb-1">Moderadamente ativo</h3>
<span class="material-symbols-outlined text-secondary" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<p class="text-primary/70 text-sm leading-relaxed font-medium">Exercícios moderados 3-5 vezes por semana.</p>
</div>
</button>
<!-- Option: Muito ativo -->
<button class="group relative flex items-center p-6 bg-surface-container-low rounded-lg transition-all duration-300 hover:bg-surface-container-highest active:scale-[0.98] text-left">
<div class="flex-shrink-0 w-14 h-14 bg-surface-container-lowest rounded-full flex items-center justify-center mr-6 shadow-sm group-hover:bg-white">
<span class="material-symbols-outlined text-[#005F6B] text-2xl" data-icon="bolt">bolt</span>
</div>
<div class="flex-grow">
<h3 class="font-headline font-semibold text-xl text-primary mb-1">Muito ativo</h3>
<p class="text-on-surface-variant text-sm leading-relaxed">Atividade física intensa diária ou trabalho braçal.</p>
</div>
</button>
</div>
</main>
<!-- Contextual Footer Actions -->
<div class="fixed bottom-0 left-0 w-full p-6 md:px-12 md:pb-12 bg-gradient-to-t from-background via-background/90 to-transparent flex flex-col md:flex-row items-center justify-between gap-4">
<div class="hidden md:flex items-center gap-2 text-on-surface-variant text-sm font-medium">
<span class="material-symbols-outlined text-lg" data-icon="info">info</span>
            Sua seleção ajuda a personalizar seu plano metabólico.
        </div>
<div class="flex items-center gap-4 w-full md:w-auto">
<button class="flex-1 md:flex-none h-14 px-8 rounded-lg font-label font-semibold text-primary hover:bg-surface-container transition-all duration-300">
                Voltar
            </button>
<button class="flex-[2] md:flex-none h-16 px-12 rounded-lg font-headline font-bold text-on-primary bg-primary bg-gradient-to-r from-primary to-primary-container shadow-xl shadow-primary/10 hover:shadow-primary/20 hover:scale-[1.02] transition-all duration-300">
                Continuar
            </button>
</div>
</div>
<!-- Decorative Leaf Element (Background Context) -->
<div class="fixed top-1/4 -right-24 w-64 h-64 bg-secondary-container/10 rounded-full blur-[100px] pointer-events-none -z-10"></div>
<div class="fixed bottom-1/4 -left-24 w-48 h-48 bg-primary-container/5 rounded-full blur-[80px] pointer-events-none -z-10"></div>
</body></html>
