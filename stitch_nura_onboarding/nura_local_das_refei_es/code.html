<body class="bg-surface font-body text-on-surface antialiased min-h-screen flex flex-col items-center">
<!-- Subtle Progress Flow -->
<div class="fixed top-0 left-0 w-full h-1 bg-surface-container-high z-50">
<div class="h-full bg-secondary transition-all duration-700 ease-in-out" style="width: 29.7%;"></div> <!-- Step 11 of 37 -->
</div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full bg-[#f5fcdf] dark:bg-stone-950 flex items-center justify-between px-6 h-16 w-full max-w-md mx-auto z-40">
<button class="text-[#005F6B] dark:text-[#008ba0] hover:opacity-80 transition-opacity duration-300 scale-95 duration-300 ease-in-out">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['LexEND'] uppercase tracking-widest text-sm text-[#005F6B] dark:text-[#008ba0]">NURA</h1>
<div class="w-6"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md px-6 pt-24 pb-32 flex flex-col relative overflow-hidden">
<!-- Contextual Leaf (Decorative background element) -->
<div class="absolute -top-10 -right-10 w-48 h-48 bg-secondary-container opacity-20 blur-3xl rounded-full pointer-events-none"></div>
<div class="absolute bottom-20 -left-10 w-32 h-32 bg-tertiary-container opacity-10 blur-2xl rounded-full pointer-events-none"></div>
<!-- Editorial Headline -->
<div class="mb-10 mt-4 relative z-10">
<span class="font-headline text-tertiary text-xs font-semibold tracking-widest uppercase mb-2 block">PASSO 11 DE 37</span>
<h2 class="font-headline text-3xl font-bold text-primary leading-tight tracking-tight">
                Onde costuma fazer as suas refeições?
            </h2>
</div>
<!-- Elegance Selector Cards -->
<div class="flex flex-col gap-5 relative z-10">
<!-- Option 1 -->
<button class="group relative w-full p-8 text-left bg-surface-container-low rounded-lg transition-all duration-300 ease-in-out hover:bg-surface-container-high focus:outline-none focus:ring-2 focus:ring-primary/10">
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-highest text-primary">
<span class="material-symbols-outlined" data-icon="home">home</span>
</div>
<span class="font-headline text-lg font-medium text-on-surface">Em casa</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant group-hover:border-primary transition-colors"></div>
</div>
</button>
<!-- Option 2 (Pre-selected representation) -->
<button class="group relative w-full p-8 text-left bg-primary-fixed-dim rounded-lg transition-all duration-300 ease-in-out shadow-[0_16px_32px_rgba(26,28,26,0.04)] focus:outline-none">
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 flex items-center justify-center rounded-full bg-primary text-on-primary">
<span class="material-symbols-outlined" data-icon="work">work</span>
</div>
<span class="font-headline text-lg font-semibold text-primary">No trabalho</span>
</div>
<div class="w-6 h-6 rounded-full bg-secondary flex items-center justify-center">
<span class="material-symbols-outlined text-white text-sm" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<!-- Tactical Depth: Overlapping Number -->
<div class="absolute -right-2 -bottom-2 text-6xl font-bold text-primary/5 pointer-events-none select-none">02</div>
</button>
<!-- Option 3 -->
<button class="group relative w-full p-8 text-left bg-surface-container-low rounded-lg transition-all duration-300 ease-in-out hover:bg-surface-container-high focus:outline-none focus:ring-2 focus:ring-primary/10">
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-highest text-primary">
<span class="material-symbols-outlined" data-icon="restaurant">restaurant</span>
</div>
<span class="font-headline text-lg font-medium text-on-surface">Restaurantes/Rua</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant group-hover:border-primary transition-colors"></div>
</div>
</button>
</div>
<!-- Instructional Subtext -->
<p class="mt-8 text-on-surface-variant text-sm text-center leading-relaxed px-4">
            A sua resposta ajuda-nos a adaptar as sugestões de menu ao seu estilo de vida diário.
        </p>
<!-- Primary Action -->
<div class="mt-12">
<button class="w-full h-16 bg-primary text-on-primary rounded-lg font-headline font-bold text-lg shadow-lg hover:opacity-90 transition-all flex items-center justify-center gap-2">

</button>
