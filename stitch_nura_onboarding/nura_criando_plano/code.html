<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NURA - Personalizing Your Flow</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#e2e3df",
                        "on-background": "#1a1c1a",
                        "on-primary-container": "#90d6e4",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#66dd8b",
                        "on-secondary-container": "#00743a",
                        "on-secondary": "#ffffff",
                        "surface-container": "#edeeea",
                        "outline": "#6f797b",
                        "secondary-container": "#83fba5",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2e312f",
                        "inverse-primary": "#8bd2df",
                        "on-surface-variant": "#3f484a",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#005227",
                        "tertiary-container": "#7d491f",
                        "surface": "#f9faf6",
                        "on-surface": "#1a1c1a",
                        "primary": "#00464f",
                        "primary-fixed-dim": "#8bd2df",
                        "surface-tint": "#156874",
                        "tertiary-fixed": "#ffdcc5",
                        "surface-container-high": "#e7e9e5",
                        "on-tertiary-fixed-variant": "#6b3a11",
                        "tertiary-fixed-dim": "#ffb783",
                        "on-primary-fixed": "#001f24",
                        "secondary": "#006d36",
                        "on-primary-fixed-variant": "#004e59",
                        "surface-dim": "#d9dad7",
                        "on-tertiary-fixed": "#301400",
                        "on-primary": "#ffffff",
                        "background": "#f9faf6",
                        "primary-container": "#005f6b",
                        "tertiary": "#613309",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f3f4f0",
                        "inverse-on-surface": "#f0f1ed",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#a7eefc",
                        "surface-variant": "#e2e3df",
                        "on-tertiary-container": "#ffbd8f",
                        "secondary-fixed": "#83fba5",
                        "on-secondary-fixed": "#00210c",
                        "surface-bright": "#f9faf6",
                        "outline-variant": "#bec8ca"
                    },
                    fontFamily: {
                        "headline": ["Lexend"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .ai-glow {
            background: radial-gradient(circle at center, rgba(131, 251, 165, 0.15) 0%, rgba(249, 250, 246, 0) 70%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased overflow-hidden">
<!-- Progress Bar (Sutil Flow) -->
<div class="fixed top-0 left-0 w-full h-1 bg-surface-container-high z-[60]">
<div class="h-full bg-secondary w-4/5"></div>
</div>
<!-- Top Navigation Anchor (Manual Suppression logic: Hidden on this focused loading screen) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-8 h-20 w-full bg-stone-50/70 dark:bg-stone-950/70 backdrop-blur-xl">
<div class="text-2xl font-bold tracking-tighter text-teal-900 dark:text-teal-500 font-lexend">NURA</div>
<div class="p-2 rounded-full hover:bg-stone-200/50 transition-all">
<span class="material-symbols-outlined text-teal-900" data-icon="close">close</span>
</div>
</header>
<main class="relative min-h-screen flex flex-col items-center justify-center px-6 pt-20 pb-12 overflow-hidden">
<!-- Contextual Leaf (Decorative) -->
<div class="absolute -top-20 -right-20 w-96 h-96 bg-secondary-container opacity-10 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute -bottom-40 -left-20 w-[30rem] h-[30rem] bg-primary-fixed-dim opacity-10 rounded-full blur-[120px] pointer-events-none"></div>
<!-- AI Core Visual -->
<div class="relative w-72 h-72 flex items-center justify-center mb-16">
<!-- Animated Ambient Rings (CSS only concept) -->
<div class="absolute inset-0 border-[0.5px] border-secondary/20 rounded-full scale-110"></div>
<div class="absolute inset-0 border-[1px] border-secondary/10 rounded-full scale-[1.25]"></div>
<!-- Central Processing Orb -->
<div class="relative z-10 w-48 h-48 rounded-full bg-surface-container-lowest shadow-[0_0_60px_rgba(0,109,54,0.1)] flex items-center justify-center group overflow-hidden">
<div class="ai-glow absolute inset-0"></div>
<div class="relative z-20 flex flex-col items-center">
<span class="material-symbols-outlined text-secondary text-5xl mb-2" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<div class="flex gap-1.5">
<div class="w-1.5 h-1.5 rounded-full bg-secondary"></div>
<div class="w-1.5 h-1.5 rounded-full bg-secondary/40"></div>
<div class="w-1.5 h-1.5 rounded-full bg-secondary/20"></div>
</div>
</div>
<!-- Micro-grid pattern overlay -->
<div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(circle, #00464f 1px, transparent 1px); background-size: 12px 12px;"></div>
</div>
<!-- Asymmetric Data Nodes -->
<div class="absolute top-0 right-4 p-3 bg-surface-container-lowest rounded-2xl shadow-sm border border-secondary/5 flex items-center gap-3 backdrop-blur-md">
<span class="material-symbols-outlined text-secondary text-lg" data-icon="monitor_heart">monitor_heart</span>
<span class="text-[10px] font-bold tracking-widest uppercase text-outline">BIOMETRIC_DATA</span>
</div>
<div class="absolute bottom-8 -left-8 p-3 bg-surface-container-lowest rounded-2xl shadow-sm border border-secondary/5 flex items-center gap-3 backdrop-blur-md">
<span class="material-symbols-outlined text-secondary text-lg" data-icon="restaurant">restaurant</span>
<span class="text-[10px] font-bold tracking-widest uppercase text-outline">MACRO_SYNC</span>
</div>
</div>
<!-- Editorial Content -->
<div class="text-center max-w-md z-20">
<h1 class="font-headline text-4xl md:text-5xl font-medium tracking-tight text-primary mb-6">
                Criando seu <span class="text-secondary italic">Flow</span> único...
            </h1>
<!-- Processing Messages Container -->
<div class="space-y-4">
<div class="flex items-center justify-center gap-3 text-on-surface-variant group">
<span class="material-symbols-outlined text-secondary text-xl" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<p class="font-body text-lg font-light tracking-tight">Analisando biometria</p>
</div>
<div class="flex items-center justify-center gap-3 text-primary">
<div class="w-5 h-5 flex items-center justify-center">
<div class="w-4 h-4 border-2 border-secondary/30 border-t-secondary rounded-full animate-spin"></div>
</div>
<p class="font-body text-lg font-medium tracking-tight">Otimizando macros</p>
</div>
<div class="flex items-center justify-center gap-3 text-stone-400 opacity-60">
<span class="material-symbols-outlined text-xl" data-icon="circle">circle</span>
<p class="font-body text-lg font-light tracking-tight">Sincronizando com seu ritmo</p>
</div>
</div>
</div>
<!-- Progress Indicator -->
<div class="mt-20 w-full max-w-xs h-1.5 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-secondary w-[64%] rounded-full shadow-[0_0_8px_rgba(0,109,54,0.3)]"></div>
</div>
<p class="mt-4 text-outline text-xs tracking-widest font-bold uppercase font-label">Processando Algoritmo v2.4</p>
</main>
<!-- Navigation Shell Suppressed for Loading Step -->
<!-- Decorative Corner Element -->
<div class="fixed bottom-0 right-0 p-12 pointer-events-none opacity-20">
<span class="material-symbols-outlined text-[12rem] text-secondary rotate-12" data-icon="eco">eco</span>
</div>
</body></html>
